    // --- NUMBER TO WORDS (INDIAN CURRENCY FORMAT) ---
    function numberToWordsINR(num) {
      if (!num || isNaN(num)) return "Zero Rupees Only";
      const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
      const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

      function inWords(n) {
        if ((n = n.toString()).length > 9) return 'overflow';
        let n_arr = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_arr) return '';
        let str = '';
        str += (n_arr[1] != 0) ? (a[Number(n_arr[1])] || b[n_arr[1][0]] + ' ' + a[n_arr[1][1]]) + 'Crore ' : '';
        str += (n_arr[2] != 0) ? (a[Number(n_arr[2])] || b[n_arr[2][0]] + ' ' + a[n_arr[2][1]]) + 'Lakh ' : '';
        str += (n_arr[3] != 0) ? (a[Number(n_arr[3])] || b[n_arr[3][0]] + ' ' + a[n_arr[3][1]]) + 'Thousand ' : '';
        str += (n_arr[4] != 0) ? (a[Number(n_arr[4])] || b[n_arr[4][0]] + ' ' + a[n_arr[4][1]]) + 'Hundred ' : '';
        str += (n_arr[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_arr[5])] || b[n_arr[5][0]] + ' ' + a[n_arr[5][1]]) : '';
        return str.trim();
      }
      return `${inWords(num)} Rupees Only`;
    }

                      )}

                      <div className="flex gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setIsForgotModalOpen(false)}
                          className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 bg-[#E22D4E] hover:bg-[#c92040] text-white text-xs font-bold py-2.5 rounded-xl shadow"

              )}

          ) : (

              onBackToPublic={() => setView('public')}
              onLogout={handleAdminLogout}
              orgSettings={orgSettings}
              setOrgSettings={setOrgSettings}
              receipts={receipts}
              setReceipts={setReceipts}
              bankAccounts={bankAccounts}
              setBankAccounts={setBankAccounts}

              setBankTransactions={setBankTransactions}

              setSelectedFY={setSelectedFY}
              selectedMonth={selectedMonth}
              setSelectedMonth={setSelectedMonth}
              selectedDate={selectedDate}
              setSelectedDate={setSelectedDate}
              globalSearch={globalSearch}
              setGlobalSearch={setGlobalSearch}
              fyTotals={fyTotals}
              onViewReceipt={(r) => setActiveReceiptModal(r)}
              onOpenCreateReceipt={() => setIsCreateReceiptOpen(true)}
              onOpenActivitiesForReceipt={(r) => setReceiptActivityTarget(r)}
              notify={notify}
            />
          )}

          {/* VIEW / PRINT DONATION RECEIPT MODAL */}
          {activeReceiptModal && (
            <ReceiptViewModal 
              receipt={activeReceiptModal}
              orgSettings={orgSettings}
              onClose={() => setActiveReceiptModal(null)}
              notify={notify}
            />
          )}

          {/* CREATE DONATION RECEIPT MODAL */}
          {isCreateReceiptOpen && (
            <CreateReceiptModal 
              orgSettings={orgSettings}
              receipts={receipts}
              onClose={() => setIsCreateReceiptOpen(false)}
              onSave={(newRec, createNext = false) => {
                setReceipts([newRec, ...receipts]);
                notify(`Receipt ${newRec.receiptNo} created successfully!`);
                if (!createNext) {
                  setIsCreateReceiptOpen(false);
                  setActiveReceiptModal(newRec); // Auto open PDF view
                }
              }}
            />
          )}

          {/* RECEIPT-LINKED ACTIVITIES MODAL */}
          {receiptActivityTarget && (
            <ReceiptActivityModal 
              receipt={receiptActivityTarget}
              onClose={() => setReceiptActivityTarget(null)}
              onAddActivity={(newAct) => {
                const updated = receipts.map(r => {
                  if (r.id === receiptActivityTarget.id) {
                    const acts = r.activities || [];
                    return { ...r, activities: [newAct, ...acts] };
                  }
                  return r;
                });
                setReceipts(updated);
                setReceiptActivityTarget({
                  ...receiptActivityTarget,
                  activities: [newAct, ...(receiptActivityTarget.activities || [])]
                });
                notify(`Activity "${newAct.name}" linked to ${receiptActivityTarget.receiptNo}!`);
              }}
            />
          )}

        </div>
      );

    // =========================================================================
    // SECTION 2 & 5: DONATION RECEIPTS (INDIAN FY HIERARCHY + AUDIT TRAIL)
    // =========================================================================
    function SectionDonationReceipts({
      receipts,
      setReceipts,
      selectedFY,
      setSelectedFY,
      selectedMonth,
      setSelectedMonth,
      selectedDate,
      setSelectedDate,
      globalSearch,
      onViewReceipt,
      onOpenCreateReceipt,
      onOpenActivities,
      notify
    }) {

      // Extract unique dates for the selected Month & FY
      const datesInMonth = useMemo(() => {
        const matching = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth);
        const unique = Array.from(new Set(matching.map(r => r.date))).sort().reverse();
        return unique;
      }, [receipts, selectedFY, selectedMonth]);

      // Filtered records
      const displayReceipts = useMemo(() => {
        return receipts.filter(r => {
          if (globalSearch.trim()) {
            const q = globalSearch.toLowerCase();
            return (
              r.receiptNo.toLowerCase().includes(q) ||
              r.donorName.toLowerCase().includes(q) ||
              (r.mobile && r.mobile.includes(q)) ||
              (r.pan && r.pan.toLowerCase().includes(q)) ||
              (r.purpose && r.purpose.toLowerCase().includes(q))
            );
          }
          if (selectedDate) return r.financialYear === selectedFY && r.date === selectedDate;
          return r.financialYear === selectedFY && r.month === selectedMonth;
        });
      }, [receipts, selectedFY, selectedMonth, selectedDate, globalSearch]);

      const handleCancelReceipt = (receiptId) => {
        const reason = prompt("Enter official cancellation reason for audit records:");
        if (!reason) return;
        setReceipts(receipts.map(r => r.id === receiptId ? { ...r, status: 'Cancelled', cancelReason: reason } : r));
        notify("Receipt cancelled and retained in audit history.", "error");
      };

      return (
        <div className="space-y-6">
          
          {/* Header & Controls */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Donation Receipts Register</h2>
              <p className="text-xs text-slate-500">
                Organised: Financial Year ({selectedFY}) → Month ({selectedMonth}) {selectedDate && `→ Date (${selectedDate})`}
              </p>
            </div>
            <button
              onClick={onOpenCreateReceipt}
              className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 self-start md:self-auto"
            >
              <span>➕</span>
              <span>Create Donation Receipt</span>
            </button>
          </div>

          {/* Month Selector Pills (April - March) */}
          <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm overflow-x-auto flex items-center gap-1.5">
            {FY_MONTHS.map(m => {
              const count = receipts.filter(r => r.financialYear === selectedFY && r.month === m).length;
              return (
                <button
                  key={m}
                  onClick={() => { setSelectedMonth(m); setSelectedDate(""); }}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition flex items-center gap-1.5 ${
                    selectedMonth === m 
                      ? 'bg-[#10141E] text-white shadow' 
                      : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <span>{m}</span>
                  {count > 0 && (
                    <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${selectedMonth === m ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-700'}`}>
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          {/* Date Selector Pills (Chronological) */}
          {datesInMonth.length > 0 && (
            <div className="flex items-center gap-2 overflow-x-auto text-xs py-1">
              <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Filter Date:</span>
              <button
                onClick={() => setSelectedDate("")}
                className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                  !selectedDate ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                }`}
              >
                All Dates in {selectedMonth}
              </button>
              {datesInMonth.map(d => (
                <button
                  key={d}
                  onClick={() => setSelectedDate(d)}
                  className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                    selectedDate === d ? 'bg-[#E22D4E] text-white' : 'bg-white border text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  {d}
                </button>
              ))}
            </div>
          )}

          {/* Clean Receipt List Table (Section 5) */}
          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
              <span className="text-xs font-extrabold text-slate-800">
                Displaying {displayReceipts.length} Donation Receipts
              </span>

          date: actDate,
          name: actName,

        setActName('');

                  />

                    <p className="text-[10px] text-emerald-600 font-bold mt-1">✓ {uploadedFiles.join(', ')}</p>
                  )}
                </div>

                <div className="flex justify-end gap-2 pt-2">

            {/* List of Activities for this receipt */}

                activities.map(a => (

                        <span className="text-xs font-extrabold text-slate-900">{a.name}</span>
                        <span className="text-[10px] text-rose-600 font-bold">({a.category})</span>
                      </div>
                      <p className="text-xs text-slate-600 mt-1">{a.note}</p>
                      <div className="text-[10px] text-slate-400 mt-1">
                        Beneficiary: <strong className="text-slate-700">{a.beneficiary || 'Verified Beneficiary'}</strong> •

                    <div className="text-right shrink-0">
                      <span className="text-sm font-extrabold text-[#E22D4E]">₹{a.amountUtilised.toLocaleString()}</span>

    // =========================================================================

    // =========================================================================
    // SECTION 9 & 10: BANK STATEMENTS MANAGEMENT & RECONCILIATION
    // =========================================================================
    function SectionBankStatements({
      bankAccounts,
      setBankAccounts,
      bankTransactions,
      setBankTransactions,
      receipts,
      selectedFY,
      notify
    }) {
      const [isAddingTxn, setIsAddingTxn] = useState(false);
      const [txnDate, setTxnDate] = useState(new Date().toISOString().slice(0, 10));
      const [txnDesc, setTxnDesc] = useState('');
      const [txnRef, setTxnRef] = useState('');
      const [txnCredit, setTxnCredit] = useState('');
      const [txnDebit, setTxnDebit] = useState('');

      const handleAddTxn = (e) => {
        e.preventDefault();
        const credit = Number(txnCredit || 0);
        const debit = Number(txnDebit || 0);

        // Check if there is a matching receipt automatically
        const matched = receipts.find(r => r.amount === credit && (r.refNo === txnRef || r.paymentMode === 'UPI' || r.paymentMode === 'Bank Transfer'));

        const newT = {
          id: `TXN-${Date.now()}`,
          date: txnDate,
          desc: txnDesc,
          ref: txnRef,
          credit,
          debit,
          balance: 145000 + credit - debit,
          matchStatus: matched ? "Matched" : "Pending Verification",
          receiptNo: matched ? matched.receiptNo : ""
        };

        setBankTransactions([newT, ...bankTransactions]);
        setIsAddingTxn(false);
        setTxnDesc('');
        setTxnRef('');
        setTxnCredit('');
        setTxnDebit('');
        notify("Bank statement transaction recorded and reconciled!");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Bank Statement Reconciliation</h2>
              <p className="text-xs text-slate-500">Auto-match bank credits with donation receipts to avoid duplicate income.</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setIsAddingTxn(true)}
                className="bg-[#10141E] hover:bg-[#E22D4E] text-white font-bold text-xs px-4 py-2.5 rounded-xl transition"
              >
                + Manual Bank Entry
              </button>
            </div>
          </div>

          {/* Bank Accounts Grid */}
          <div className="grid md:grid-cols-2 gap-4">
            {bankAccounts.map(b => (
              <div key={b.id} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-2">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-900">{b.bankName}</h3>
                    <p className="text-xs text-slate-400">A/C: {b.accountNo} • IFSC: {b.ifsc}</p>
                  </div>
                  <span className="text-[10px] font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">{b.type}</span>
                </div>
                <div className="pt-2 flex justify-between items-end border-t border-slate-100">
                  <div>
                    <span className="text-[10px] text-slate-400 font-bold uppercase">Current Book Balance</span>
                    <p className="text-lg font-extrabold text-slate-900">₹{b.currentBalance.toLocaleString()}</p>
                  </div>
                  <span className="text-xs text-[#00A859] font-bold">✓ Active</span>
                </div>
              </div>
            ))}
          </div>

          {/* Manual Entry Form */}
          {isAddingTxn && (
            <form onSubmit={handleAddTxn} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-xs uppercase text-slate-900">Enter Statement Transaction</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Date</label>
                  <input required type="date" value={txnDate} onChange={e => setTxnDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">UTR / Ref No</label>
                  <input required type="text" placeholder="e.g. UTR/902188" value={txnRef} onChange={e => setTxnRef(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Credit Amount (₹)</label>
                  <input type="number" placeholder="5000" value={txnCredit} onChange={e => setTxnCredit(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-emerald-600" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Debit Amount (₹)</label>
                  <input type="number" placeholder="0" value={txnDebit} onChange={e => setTxnDebit(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-rose-600" />
                </div>
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Particulars / Description</label>
                <input required type="text" placeholder="e.g. UPI/Priya Sharma/Donation" value={txnDesc} onChange={e => setTxnDesc(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
              </div>
              <div className="flex justify-end gap-2">
                <button type="button" onClick={() => setIsAddingTxn(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                <button type="submit" className="bg-[#E22D4E] text-white px-5 py-2 rounded-xl text-xs font-bold">Save Transaction</button>
              </div>
            </form>
          )}

          {/* Statement Reconciliation Table */}
          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
              <span className="text-xs font-bold text-slate-800">Verified Bank Ledger Records</span>
              <button 
                onClick={() => {
                  const csv = "Date,Description,UTR,Credit,Debit,Status\n" + bankTransactions.map(t => `${t.date},"${t.desc}",${t.ref},${t.credit},${t.debit},${t.matchStatus}`).join('\n');
                  const blob = new Blob([csv], { type: 'text/csv' });
                  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bank_statement.csv'; a.click();
                }}
                className="text-xs font-bold text-[#E22D4E] hover:underline"
              >
                Download Statement (CSV) ↓
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider">
                  <tr>
                    <th className="py-3 px-5">Date</th>
                    <th className="py-3 px-5">Description</th>
                    <th className="py-3 px-5">UTR / Reference</th>
                    <th className="py-3 px-5">Credit</th>
                    <th className="py-3 px-5">Debit</th>
                    <th className="py-3 px-5">Matching Status</th>
                    <th className="py-3 px-5">Linked Receipt</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {bankTransactions.map(t => (
                    <tr key={t.id} className="hover:bg-slate-50 transition">
                      <td className="py-3 px-5 font-mono text-slate-700">{t.date}</td>
                      <td className="py-3 px-5 font-bold text-slate-800">{t.desc}</td>
                      <td className="py-3 px-5 font-mono text-slate-500">{t.ref}</td>
                      <td className="py-3 px-5 font-extrabold text-[#00A859]">
                        {t.credit > 0 ? `₹${t.credit.toLocaleString()}` : '—'}
                      </td>
                      <td className="py-3 px-5 font-extrabold text-rose-600">
                        {t.debit > 0 ? `₹${t.debit.toLocaleString()}` : '—'}
                      </td>
                      <td className="py-3 px-5">
                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                          t.matchStatus === 'Matched' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                          {t.matchStatus}
                        </span>
                      </td>
                      <td className="py-3 px-5 font-mono text-xs font-bold text-blue-600">
                        {t.receiptNo || 'Unassigned'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 11 & 12: FINANCIAL REPORTS (CONSOLIDATED MONTHLY & YEARLY + EXCEL IMPORT)
    // =========================================================================
    function SectionFinancialReports({ receipts, setReceipts, bankAccounts, bankTransactions, selectedFY, setSelectedFY, selectedMonth, setSelectedMonth, orgSettings, notify, onOpenCreateReceipt }) {
      const fileInputRef = useRef(null);
      const [isImporting, setIsImporting] = useState(false);
      // 'all-years' = show every single record across all years.
      // 'fy-all' = show all records in selected FY without filtering by month.
      // 'month' = filter by selected month.
      const [viewFilter, setViewFilter] = useState('all-years'); // 'all-years' | 'fy-all' | 'month'

      // Search & Pagination States
      const [tableSearch, setTableSearch] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const [rowsPerPage, setRowsPerPage] = useState(50); // 25, 50, 100, 200, 500

      // Filter receipts according to viewFilter & tableSearch
      const filteredReceipts = useMemo(() => {
        let base = [];
        if (viewFilter === 'all-years') {
          base = receipts.filter(r => r.status !== 'Cancelled');
        } else if (viewFilter === 'fy-all') {
          base = receipts.filter(r => r.financialYear === selectedFY && r.status !== 'Cancelled');
        } else {
          base = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth && r.status !== 'Cancelled');
        }

        if (tableSearch.trim()) {
          const q = tableSearch.toLowerCase();
          base = base.filter(r => 
            (r.donorName && r.donorName.toLowerCase().includes(q)) ||
            (r.pan && r.pan.toLowerCase().includes(q)) ||
            (r.address && r.address.toLowerCase().includes(q)) ||
            (r.receiptNo && r.receiptNo.toLowerCase().includes(q)) ||
            (r.paymentMode && r.paymentMode.toLowerCase().includes(q)) ||
            (r.date && r.date.includes(q)) ||
            (r.sNo && String(r.sNo).includes(q))
          );
        }
        return base;
      }, [receipts, selectedFY, selectedMonth, viewFilter, tableSearch]);

      // Reset to page 1 when filter or search changes
      useEffect(() => {
        setCurrentPage(1);
      }, [viewFilter, selectedFY, selectedMonth, tableSearch, rowsPerPage]);

      const totalPages = Math.max(1, Math.ceil(filteredReceipts.length / rowsPerPage));
      const paginatedReceipts = useMemo(() => {
        const start = (currentPage - 1) * rowsPerPage;
        return filteredReceipts.slice(start, start + rowsPerPage);
      }, [filteredReceipts, currentPage, rowsPerPage]);

      const totalDonationsAmount = filteredReceipts.reduce((a,c) => a + Number(c.amount || 0), 0);
      
      let matchedActivities = [];
      filteredReceipts.forEach(r => {
        (r.activities || []).forEach(a => matchedActivities.push({ ...a, receiptNo: r.receiptNo, donorName: r.donorName }));
      });
      const totalUtilisedAmount = matchedActivities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0);

      // Handle Excel Upload (.xlsx / .xls)
      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsImporting(true);
        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            if (!window.XLSX) {
              alert("Excel reader library is loading. Please try again in 2 seconds.");
              setIsImporting(false);
              return;
            }

            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            
            let allRows = [];
            // Parse through all sheets
            workbook.SheetNames.forEach(sheetName => {
              const worksheet = workbook.Sheets[sheetName];
              // 1. First convert sheet to 2D array of rows to accurately detect header row
              const sheetData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
              if (!sheetData || !sheetData.length) return;

              // 2. Find which row index contains the column headers
              let headerRowIndex = 0;
              for (let i = 0; i < Math.min(sheetData.length, 10); i++) {
                const rowCells = sheetData[i].map(c => String(c).toLowerCase().replace(/[^a-z0-9]/g, ''));
                // Check if this row looks like header: has 'pan', 'donor', 'date', or 'amt'
                const hasPan = rowCells.some(c => c.includes('pan'));
                const hasDonor = rowCells.some(c => c.includes('donor') || c.includes('name'));
                const hasAmt = rowCells.some(c => c.includes('amt') || c.includes('amount'));
                if ((hasPan && hasDonor) || (hasDonor && hasAmt) || (hasPan && hasAmt)) {
                  headerRowIndex = i;
                  break;
                }
              }

              // 3. Extract JSON using the detected header row
              const json = window.XLSX.utils.sheet_to_json(worksheet, { range: headerRowIndex, defval: "" });
              if (json && json.length) {
                // Attach the sheet name to each row so we know its Financial Year (e.g. FY 2025-2026, FY 2024-2025, etc.)
                const withSheet = json.map(r => ({ ...r, _sheetName: sheetName }));
                allRows = [...allRows, ...withSheet];
              }
            });

            if (!allRows.length) {
              alert("No data found in the selected Excel file.");
              setIsImporting(false);
              return;
            }

            // Normalise and convert rows into official Trust Donation Receipts
            let importedCount = 0;
            const newReceipts = [];

            allRows.forEach((row, idx) => {
              // Try finding PAN, Name, Amount, Date, Mobile from common column names
              const keys = Object.keys(row);
              const findVal = (keywords) => {
                const foundKey = keys.find(k => {
                  const cleanKey = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                  return keywords.some(kw => cleanKey.includes(kw));
                });
                return foundKey ? row[foundKey] : "";
              };

              const donorNameRaw = findVal(["nameofdonor", "donorname", "donor", "name", "client", "person"]);
              // If there's no donor name and no amount and no PAN, skip blank trailing rows
              if (!donorNameRaw && !row["AMT INVOLVED IN RS"] && !row["PAN OF DONOR"]) {
                return;
              }
              const donorName = donorNameRaw ? String(donorNameRaw).trim() : "Valued Donor";

              // Find PAN: check "panofdonor", "panno", "pan", etc.
              let panRaw = (findVal(["panofdonor", "donorpan", "pan", "pannumber", "panno"]) || "").toString().trim().toUpperCase();
              // Ignore placeholders like "NO", "NILL", "NIL", "NA", "NONE", "-"
              if (["NO", "NILL", "NIL", "NA", "N/A", "NONE", "-", ""].includes(panRaw)) {
                panRaw = "";
              }
              const pan = panRaw;

              // Exact columns from Excel
              const sNo = findVal(["sno", "slno", "serial"]) || (importedCount + 1);
              const address = (findVal(["addreesofdonor", "addressofdonor", "address", "city", "place"]) || "").toString().trim();
              const paymentMode = (findVal(["modeofpayment", "paymentmode", "mode", "method"]) || "UPI").toString().trim();
              const nature = (findVal(["naturedonationcorpusornoncorpus", "natureofdonation", "nature", "corpus", "noncorpus"]) || "NON CORPUS").toString().trim();

              // Amount
              let amount = parseFloat((findVal(["amtinvolvedinrs", "amountinvolved", "amount", "donationamount", "amt", "total"]) || "0").toString().replace(/[^0-9.]/g, ''));
              if (isNaN(amount) || amount <= 0) amount = 1000;

              const mobile = (findVal(["mobile", "phone", "contact", "cell"]) || "+91 98765 43210").toString();
              const dateRaw = findVal(["date", "receiptdate", "txndate", "donationdate"]);
              
              // Normalize Date (handles DD-MM-YYYY, YYYY-MM-DD, Excel serials, etc.)
              let dateStr = "";
              if (dateRaw instanceof Date) {
                dateStr = dateRaw.toISOString().slice(0, 10);
              } else if (typeof dateRaw === 'number') {
                // Excel serial date format (offset 25569 days from Jan 1 1970)
                const excelDate = new Date(Math.round((dateRaw - 25569) * 86400 * 1000));
                if (!isNaN(excelDate.getTime())) dateStr = excelDate.toISOString().slice(0, 10);
              } else if (typeof dateRaw === 'string' && dateRaw.trim()) {
                const s = dateRaw.trim();
                // Check DD-MM-YYYY or DD/MM/YYYY or DD.MM.YYYY
                const dmyMatch = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
                // Check YYYY-MM-DD
                const ymdMatch = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
                if (dmyMatch) {
                  const day = dmyMatch[1].padStart(2, '0');
                  const month = dmyMatch[2].padStart(2, '0');
                  const year = dmyMatch[3];
                  dateStr = `${year}-${month}-${day}`;
                } else if (ymdMatch) {
                  const year = ymdMatch[1];
                  const month = ymdMatch[2].padStart(2, '0');
                  const day = ymdMatch[3].padStart(2, '0');
                  dateStr = `${year}-${month}-${day}`;
                } else {
                  dateStr = s.slice(0, 10);
                }
              }

              // Fallback if no valid date found in row
              if (!dateStr || dateStr.length < 8) {
                dateStr = "2025-04-01";
              }

              // Determine Financial Year and Month from date & sheet name
              let fy = selectedFY;
              let monthName = "April";

              try {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                  const y = parseInt(parts[0], 10);
                  const m = parseInt(parts[1], 10) - 1; // 0=Jan, 1=Feb, 2=Mar, 3=Apr... 11=Dec
                  if (!isNaN(y) && !isNaN(m) && m >= 0 && m <= 11) {
                    const CALENDAR_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                    monthName = CALENDAR_MONTHS[m];
                    const startYear = m >= 3 ? y : y - 1;
                    fy = `${startYear}-${(startYear + 1).toString().slice(-2)}`;
                  }
                }
              } catch(err) {}

              // If sheet name explicitly has FY (e.g. "FY 2021-2022" or "FY 2025-2026"), format it cleanly
              const sheetFYMatch = (row._sheetName || "").match(/20(\d{2})[-_\s/]*20?(\d{2})/i);
              if (sheetFYMatch) {
                const y1 = parseInt(`20${sheetFYMatch[1]}`, 10);
                const y2 = parseInt(`20${sheetFYMatch[2]}`, 10);
                const endShort = y2 ? String(y2).slice(-2) : String(y1 + 1).slice(-2);
                fy = `${y1}-${endShort}`;
              }

              // Auto-assign sequential receipt number
              const seqNumber = String(receipts.length + importedCount + 1).padStart(6, '0');
              const receiptNo = `${orgSettings.receiptPrefix || 'STPCT'}/${fy}/${seqNumber}`;

              newReceipts.push({
                id: `REC-IMP-${Date.now()}-${idx}`,
                sNo: sNo,
                receiptNo,
                date: dateStr,
                financialYear: fy,
                month: monthName,
                donorName: donorName,
                address: address,
                pan: pan,
                nature: nature,
                mobile: String(mobile).trim(),
                email: "",
                amount,
                amountInWords: numberToWordsINR(amount),
                purpose: nature || "NON CORPUS",
                paymentMode: paymentMode,
                refNo: `IT-PAN-IMP-${idx + 1}`,
                status: "Completed",
                activities: []
              });
              importedCount++;
            });

            if (newReceipts.length > 0) {
              // Replace any previous imported records with the fresh accurate ones
              const manualOnly = receipts.filter(r => !r.id.startsWith('REC-IMP-'));
              const combined = [...newReceipts, ...manualOnly];
              setReceipts(combined);
              
              // Set view to All Years so user immediately sees the entire dataset!
              setViewFilter('all-years');

              notify(`Successfully imported ${importedCount} records with PAN & Donor details across all Financial Years!`, "success");
            }
          } catch(err) {
            console.error("Excel import error:", err);
            alert("Error parsing Excel file: " + (err.message || err));
          } finally {
            setIsImporting(false);
            if (fileInputRef.current) fileInputRef.current.value = "";
          }
        };

        reader.readAsArrayBuffer(file);
      };

      const downloadExport = (mode = 'all') => {
        // mode: 'all' = export all years | 'fy' = export selected FY | 'month' = export selected month
        let targetReceipts = [];
        let title = "";

        if (mode === 'all') {
          targetReceipts = receipts.filter(r => r.status !== 'Cancelled');
          title = `All_Years_Consolidated_Donations_Report`;
        } else if (mode === 'fy') {
          targetReceipts = receipts.filter(r => r.financialYear === selectedFY && r.status !== 'Cancelled');
          title = `Full_FY_${selectedFY}_Consolidated_Report`;
        } else {
          targetReceipts = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth && r.status !== 'Cancelled');
          title = `Monthly_Report_${selectedMonth}_${selectedFY}`;
        }

        const totalAmt = targetReceipts.reduce((a,c) => a + Number(c.amount || 0), 0);

        const lines = [
          `SAVE THE PEOPLE CHARITABLE TRUST - CONSOLIDATED AUDIT REPORT (${title})`,
          `Registration: ${orgSettings.regNo} | PAN: ${orgSettings.orgPan} | 80G: ${orgSettings.section80G}`,
          `Generated On: ${new Date().toLocaleString()}`,
          "",
          "PART 1: DONATION RECEIPTS REGISTER (EXACT INCOME TAX FORMAT)",
          "S NO,DATE,FY,NAME OF DONOR,ADDREES OF DONOR,PAN OF DONOR,AMT INVOLVED IN RS,MODE OF PAYMENT,NATURE (CORPUS OR NON CORPUS),RECEIPT NO",
          ...targetReceipts.map((r, i) => `"${r.sNo || (i + 1)}","${r.date}","${r.financialYear}","${r.donorName}","${r.address || ''}","${r.pan || ''}",${r.amount},"${r.paymentMode || 'UPI'}","${r.nature || r.purpose || 'NON CORPUS'}","${r.receiptNo}"`),
          "",
          "PART 2: FINANCIAL RECONCILIATION SUMMARY",
          `Total Records Exported,${targetReceipts.length}`,
          `Total Donations Received,Rs. ${totalAmt}`
        ];

        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${title}.csv`;
        a.click();
        notify(`Exported ${targetReceipts.length} records successfully! (${title})`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex flex-col xl:flex-row items-start xl:items-center justify-between gap-4">
            {/* Title on the left */}
            <h2 className="text-xl font-extrabold text-slate-900 shrink-0">Comprehensive Audit Reports</h2>
            
            {/* All 4 Action Buttons in the same row towards the right */}
            <div className="flex flex-wrap items-center gap-2.5">
              {/* HIDDEN FILE INPUT FOR EXCEL IMPORT */}
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={handleExcelUpload} 
                accept=".xlsx, .xls, .csv" 
                className="hidden" 
              />

              {/* 1. NEW ENTRY (Manual Entry for single donor) */}
              <button
                onClick={onOpenCreateReceipt}
                className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-[#E22D4E]/25 transition flex items-center gap-1.5"
                title="Manually create a new donation receipt entry"
              >
                <span>➕</span>
                <span>Add Entry Manually</span>
              </button>

              {/* 2. IMPORT DATA */}
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                disabled={isImporting}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center gap-1.5"
                title="Upload Excel .xlsx / .xls file"
              >
                <span>📥</span>
                <span>{isImporting ? "Importing Data..." : "Import Data"}</span>
              </button>

              {/* 3. EXPORT DATA (Exports currently selected scope) */}
              <button
                onClick={() => downloadExport(viewFilter === 'all-years' ? 'all' : viewFilter === 'fy-all' ? 'fy' : 'month')}
                className="bg-[#10141E] hover:bg-black text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center gap-1.5"
                title="Export current view to Excel / CSV"
              >
                <span>📤</span>
                <span>Export Data</span>
              </button>

              {/* 4. DOWNLOAD MONTHLY REPORT (Enabled after selecting year and month) */}
              {viewFilter === 'month' ? (
                <button
                  onClick={() => downloadExport('month')}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5 animate-pulse"
                  title={`Download Monthly Report for ${selectedMonth} (FY ${selectedFY})`}
                >
                  <span>📄</span>
                  <span>Download Monthly Report ({selectedMonth} {selectedFY})</span>
                </button>
              ) : (
                <button
                  onClick={() => alert("Please select a specific Financial Year and Month below to download its monthly report.")}
                  className="bg-slate-100 text-slate-400 font-semibold text-xs px-4 py-2.5 rounded-xl border border-slate-200 transition cursor-not-allowed flex items-center gap-1.5"
                  title="Select a year and month below to unlock"
                >
                  <span>📄</span>
                  <span>Download Monthly Report (Select Year & Month)</span>
                </button>
              )}
            </div>
          </div>

          {/* Interactive Year & Month Hierarchy Bar */}
          <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            
            {/* 1. Year Filter Selector as a Dropdown */}
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-[#E22D4E]"></span>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-700">Financial Year Filter:</span>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto">
                <div className="relative w-full sm:w-72">
                  <select
                    value={viewFilter === 'all-years' ? 'all' : selectedFY}
                    onChange={(e) => {
                      const val = e.target.value;
                      if (val === 'all') {
                        setViewFilter('all-years');
                      } else {
                        setSelectedFY(val);
                        setViewFilter('fy-all');
                      }
                    }}
                    className="w-full appearance-none bg-slate-50 hover:bg-slate-100 border-2 border-slate-200 hover:border-[#E22D4E]/40 focus:border-[#E22D4E] focus:bg-white text-slate-800 font-bold text-xs rounded-2xl px-4 py-2.5 pr-10 shadow-sm outline-none transition cursor-pointer"
                  >
                    <option value="all">
                      🌐 All Years Combined ({receipts.filter(r => r.status !== 'Cancelled').length} Records)
                    </option>
                    {Array.from(new Set([selectedFY, ...receipts.map(r => r.financialYear).filter(Boolean)])).sort().reverse().map(fy => {
                      const countInFY = receipts.filter(r => r.financialYear === fy && r.status !== 'Cancelled').length;
                      return (
                        <option key={fy} value={fy}>
                          FY {fy} ({countInFY} Records)
                        </option>
                      );
                    })}
                  </select>
                  <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500">
                    <svg className="w-4 h-4 fill-current" viewBox="0 0 20 20">
                      <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" fillRule="evenodd"></path>
                    </svg>
                  </div>
                </div>

                {/* Quick Badge indicator */}
                <span className="hidden sm:inline-flex items-center text-[11px] font-bold px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                  {viewFilter === 'all-years' ? 'All Years View' : `Active: FY ${selectedFY}`}
                </span>
              </div>
            </div>

            {/* 2. Month Selector (Shown dynamically for the chosen Financial Year) */}
            {viewFilter !== 'all-years' ? (
              <div className="flex items-center gap-2 overflow-x-auto text-xs pt-1">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">
                  Months in FY {selectedFY}:
                </span>
                
                {/* Total All Months in this FY */}
                <button
                  onClick={() => setViewFilter('fy-all')}
                  className={`px-3.5 py-1.5 rounded-xl font-bold shrink-0 text-xs transition flex items-center gap-1.5 ${
                    viewFilter === 'fy-all' 
                      ? 'bg-slate-900 text-white shadow' 
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  <span>⭐ Full Year Total</span>

            {/* Pagination Footer Controls */}
            {filteredReceipts.length > 0 && (

                <div>

                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setCurrentPage(1)}
                    disabled={currentPage === 1}
                    className="px-2.5 py-1.5 rounded-lg border bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 font-bold"
                  >
                    « First
                  </button>
                  <button
                    onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                    disabled={currentPage === 1}
                    className="px-3 py-1.5 rounded-lg border bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 font-bold"
                  >
                    ‹ Prev
                  </button>

                  <span className="px-3 py-1 text-slate-800 font-bold">
                    Page {currentPage} of {totalPages}

                  <button
                    onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                    disabled={currentPage >= totalPages}
                    className="px-3 py-1.5 rounded-lg border bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 font-bold"
                  >
                    Next ›
                  </button>
                  <button
                    onClick={() => setCurrentPage(totalPages)}
                    disabled={currentPage >= totalPages}
                    className="px-2.5 py-1.5 rounded-lg border bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 font-bold"
                  >
                    Last »
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );

    // =========================================================================
    // SECTION 3 & 4: CREATE DONATION RECEIPT ENTRY MODAL
    // =========================================================================
    function CreateReceiptModal({ orgSettings, receipts, onClose, onSave }) {
      const today = new Date().toISOString().slice(0, 10);
      const [receiptDate, setReceiptDate] = useState(today);
      const [donorName, setDonorName] = useState('');
      const [mobile, setMobile] = useState('');
      const [email, setEmail] = useState('');
      const [pan, setPan] = useState('');
      const [address, setAddress] = useState('');
      const [amount, setAmount] = useState('');
      const [purpose, setPurpose] = useState('General Donation');
      const [otherPurpose, setOtherPurpose] = useState('');
      const [paymentMode, setPaymentMode] = useState('UPI');
      const [refNo, setRefNo] = useState('');

      // Auto generate sequential receipt number
      const computedFY = useMemo(() => {
        if (!receiptDate) return orgSettings.currentFY;
        const d = new Date(receiptDate);
        if (isNaN(d.getTime())) return orgSettings.currentFY;
        const y = d.getFullYear();
        const m = d.getMonth() + 1; // 1-12
        return m >= 4 ? `${y}-${String(y + 1).slice(-2)}` : `${y - 1}-${String(y).slice(-2)}`;
      }, [receiptDate, orgSettings]);

      const nextReceiptNumber = useMemo(() => {
        const count = receipts.length + 1;
        const padded = String(count).padStart(6, '0');
        return `${orgSettings.receiptPrefix}/${computedFY}/${padded}`;
      }, [receipts, orgSettings, computedFY]);

      const amountWords = useMemo(() => {
        return numberToWordsINR(Number(amount));
      }, [amount]);

      const handleSubmit = (createNext = false) => {
        if (!donorName || !amount) {
          alert('Please fill all mandatory fields (Donor Name, Amount).');
          return;
        }

        const dateObj = new Date(receiptDate);
        const monthName = FY_MONTHS[dateObj.getMonth() >= 3 ? dateObj.getMonth() - 3 : dateObj.getMonth() + 9];

        const newRec = {
          id: `REC-${Date.now()}`,
          receiptNo: nextReceiptNumber,
          sNo: receipts.length + 1,
          date: receiptDate,
          financialYear: computedFY,
          month: monthName,
          donorName,
          mobile: mobile || '',
          email: email || '',
          pan: pan ? pan.toUpperCase() : '',
          address: address || '',
          amount: Number(amount),
          amountInWords: amountWords,
          purpose: purpose === 'Other' ? otherPurpose : purpose,
          paymentMode,
          refNo: refNo || `${paymentMode}-DIRECT`,
          status: 'Completed',
          activities: []
        };

        onSave(newRec, createNext);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5">
            
            {/* Header */}
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-rose-600 bg-rose-50 px-2 py-0.5 rounded">
                  Auto Sequence No: {nextReceiptNumber}
                </span>
                <h3 className="text-lg font-extrabold text-slate-900 mt-1">Donation Receipt Entry</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); handleSubmit(false); }} className="space-y-4 text-xs font-semibold">
              
              {/* Part A & Date */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Receipt Date *</label>
                  <input required type="date" value={receiptDate} onChange={e => setReceiptDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Financial Year (Auto from Date)</label>
                  <input disabled type="text" value={`FY ${computedFY}`} className="w-full bg-slate-100 border rounded-xl px-3 py-2 text-xs font-bold text-slate-700" />
                </div>
              </div>

              {/* Part B: Donor Info */}
              <div className="space-y-3 pt-2 border-t border-slate-100">
                <span className="text-[10px] font-extrabold uppercase text-slate-400">Donor Particulars</span>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Received With Thanks From (Donor Name) *</label>
                    <input required type="text" placeholder="e.g. Ramesh Kumar" value={donorName} onChange={e => setDonorName(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mobile Number *</label>
                    <input required type="tel" placeholder="+91 98765 43210" value={mobile} onChange={e => setMobile(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donor PAN Number (Optional - for 80G)</label>
                    <input type="text" placeholder="ABCDE1234F" maxLength={10} value={pan} onChange={e => setPan(e.target.value.toUpperCase())} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs uppercase" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Email ID (For Auto PDF Delivery)</label>
                    <input type="email" placeholder="ramesh@example.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Address (Optional)</label>
                  <input type="text" placeholder="Residential / Org Address" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>

              {/* Part C & D: Donation Amount & Payment */}
              <div className="space-y-3 pt-2 border-t border-slate-100">
                <span className="text-[10px] font-extrabold uppercase text-slate-400">Donation & Payment Details</span>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donation Amount (₹) *</label>
                    <input required type="number" placeholder="e.g. 5000" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-extrabold text-[#E22D4E]" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donation Purpose *</label>
                    <select value={purpose} onChange={e => setPurpose(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
                      {DONATION_PURPOSES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                </div>

                {/* Amount in words preview */}
                <div className="p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[11px] text-slate-600 italic">
                  <strong>Amount in Words:</strong> {amountWords}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Payment Mode *</label>
                    <select value={paymentMode} onChange={e => setPaymentMode(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold">
                      <option value="UPI">UPI (GPay / PhonePe / QR)</option>
                      <option value="Bank Transfer">Bank Transfer (NEFT / RTGS / IMPS)</option>
                      <option value="Cash">Cash</option>
                      <option value="Cheque">Cheque / Demand Draft</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Transaction Ref / Cheque No</label>
                    <input type="text" placeholder="e.g. UTR / UPI Ref ID" value={refNo} onChange={e => setRefNo(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col sm:flex-row justify-end gap-2 pt-4 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100">
                  Cancel
                </button>
                <button 
                  type="button" 
                  onClick={() => handleSubmit(true)}
                  className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow transition"
                >
                  Save & Create Next
                </button>

              <span className="bg-white/20 text-white text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">
                Be The Change
              </span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-serif-heading max-w-2xl mx-auto">
                Ready to make a real difference in someone's life?
              </h2>
              <p className="text-rose-100 max-w-xl mx-auto text-base">
                Whether you wish to sponsor a child's education, contribute emergency meals, or volunteer your skills on the field, your support matters.
              </p>
              <div className="flex flex-wrap justify-center gap-4 pt-2">
                <button 
                  onClick={() => handleOpenDonate()}
                  className="bg-white text-[#E22D4E] hover:bg-slate-100 font-extrabold text-sm px-8 py-4 rounded-full shadow-xl transition"
                >
                  Donate Online Now
                </button>
                <button 
                  onClick={() => setIsVolunteerOpen(true)}
                  className="bg-[#10141E] hover:bg-black text-white font-bold text-sm px-8 py-4 rounded-full shadow-xl transition"
                >
                  Join as Volunteer
                </button>
              </div>
            </div>
          </section>

          {/* 7. COMPLETE FOOTER */}
          <footer className="bg-[#10141E] text-slate-400 pt-16 pb-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div className="space-y-4">
                  <div className="flex items-center">
                    <img 
                      src="images/save_the_people_logo.jpeg" 
                      alt="Save The People" 
                      className="h-16 w-auto object-contain rounded"
                      onError={e => e.target.style.display = 'none'}
                    />
                  </div>
                  <p className="text-xs leading-relaxed text-slate-400">
                    A registered non-profit organization helping children, low-income families, and patients across India with dignity and care.
                  </p>
                  <div className="text-xs font-semibold text-slate-300">
                    <span className="text-[#00A859]">✓ 80G Certified Non-Profit</span>
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Quick Links</h4>
                  <ul className="space-y-2 text-xs">
                    <li><a href="#" className="hover:text-white transition">Home</a></li>
                    <li><a href="#about" className="hover:text-white transition">About Our Mission</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Urgent Causes</a></li>
                    <li><a href="#impact" className="hover:text-white transition">Financial Impact</a></li>
                    <li><button onClick={onOpenAdmin} className="text-rose-400 hover:text-rose-300 transition">Admin Login</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Key Causes</h4>
                  <ul className="space-y-2 text-xs">
                    <li><a href="#causes" className="hover:text-white transition">Hunger & Malnutrition</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Childhood Education</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Emergency Medical Care</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Disaster Relief Fund</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Support & Donate</h4>
                  <p className="text-xs text-slate-400 mb-4">
                    All donations are exempt from tax under Section 80G. Instant payment confirmation via Razorpay.
                  </p>
                  <button 
                    onClick={() => handleOpenDonate()}
                    className="w-full bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs py-3 rounded-full transition"
                  >
                    Make a Direct Donation
                  </button>
                </div>
              </div>

              <div className="border-t border-slate-800 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                <p>© {new Date().getFullYear()} Save The People. All Rights Reserved.</p>
                <div className="flex gap-4">
                  <span>Razorpay Secured</span>
                  <span>•</span>
                  <span>80G Registered NGO</span>
                </div>
              </div>
            </div>
          </footer>

          {/* Direct Donation Popup */}
          {isDonateOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">Donate to Save The People</h3>
                  <button onClick={() => setIsDonateOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-600">
                  Cause: <strong>{selectedCause ? selectedCause.title : "General Trust Support"}</strong>
                </p>
                <div className="p-4 bg-rose-50 rounded-2xl border border-rose-100 text-center space-y-2">
                  <p className="text-xs font-bold text-slate-700">Scan & Pay via any UPI App or NetBanking</p>
                  <p className="text-xs font-mono font-bold text-[#E22D4E]">UPI ID: savethepeople@sbi</p>
                  <p className="text-[11px] text-slate-500">Official 80G Tax Exemption receipts are generated immediately upon receipt verification.</p>
                </div>
                <button 
                  onClick={() => {
                    alert("Thank you! For online auto-receipts, open Admin Panel → 2. Donation Receipts.");
                    setIsDonateOpen(false);
                  }}
                  className="w-full bg-[#E22D4E] text-white font-bold py-3 rounded-full text-xs"
                >
                  Confirm & Request Receipt
                </button>
              </div>
            </div>
          )}

          {/* Volunteer Modal */}
          {isVolunteerOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">Become a Volunteer</h3>
                  <button onClick={() => setIsVolunteerOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); alert("Volunteer application submitted!"); setIsVolunteerOpen(false); }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                    <input required type="text" placeholder="Your name" className="w-full bg-slate-50 border rounded-xl px-3.5 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Phone Number</label>
                    <input required type="tel" placeholder="+91 98765 43210" className="w-full bg-slate-50 border rounded-xl px-3.5 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Field of Interest</label>
                    <select className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
                      <option>Food & Ration Distribution</option>
                      <option>Medical Health Camps</option>
                      <option>Child Teaching & Mentorship</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-[#E22D4E] text-white font-bold py-3 rounded-full text-xs">
                    Submit Application
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Global Error Logger and Resilient Error Boundary
    window.addEventListener('error', function(e) {
      console.error('Window error captured:', e.error || e.message);
    });

    class ErrorBoundary extends React.Component {
      constructor(props) { 
        super(props); 
        this.state = { hasError: false, error: null }; 
      }
      static getDerivedStateFromError(error) { 
        return { hasError: true, error }; 
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Component Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-lg mx-auto my-12 bg-white rounded-3xl border border-rose-200 shadow-xl text-center space-y-4">
              <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
              <h2 className="text-base font-extrabold text-slate-900">Application Notice</h2>
              <p className="text-xs text-slate-500 font-mono bg-slate-50 p-3 rounded-xl border border-slate-100 break-words text-left">
                {this.state.error?.message || "An unexpected rendering event occurred."}
              </p>
              <button 
                onClick={() => { localStorage.clear(); window.location.reload(); }} 
                className="bg-[#E22D4E] hover:bg-[#c92040] text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow transition"
              >
                Clear Local Cache & Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
