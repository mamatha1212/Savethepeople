    // --- NUMBER TO WORDS (INDIAN CURRENCY FORMAT) ---
    function numberToWordsINR(num) {
      if (!num || isNaN(num)) return "Zero Rupees Only";
      const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
      const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

      function inWords(n) {
        if ((n = n.toString()).length > 9) return 'overflow';
        let n_arr = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_arr) return '';
        let str = '';
        str += (n_arr[1] != 0) ? (a[Number(n_arr[1])] || b[n_arr[1][0]] + ' ' + a[n_arr[1][1]]) + 'Crore ' : '';
        str += (n_arr[2] != 0) ? (a[Number(n_arr[2])] || b[n_arr[2][0]] + ' ' + a[n_arr[2][1]]) + 'Lakh ' : '';
        str += (n_arr[3] != 0) ? (a[Number(n_arr[3])] || b[n_arr[3][0]] + ' ' + a[n_arr[3][1]]) + 'Thousand ' : '';
        str += (n_arr[4] != 0) ? (a[Number(n_arr[4])] || b[n_arr[4][0]] + ' ' + a[n_arr[4][1]]) + 'Hundred ' : '';
        str += (n_arr[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_arr[5])] || b[n_arr[5][0]] + ' ' + a[n_arr[5][1]]) : '';
        return str.trim();
      }
      return `${inWords(num)} Rupees Only`;
    }

        let totalUtilised = 0;
        let totalActivitiesCount = 0;
        fyReceipts.forEach(r => {
          (r.activities || []).forEach(a => {
            totalUtilised += Number(a.amountUtilised || 0);
            totalActivitiesCount++;
          });
        });

        const remainingFunds = totalDonations - totalUtilised;
        const totalBankBalance = bankAccounts.reduce((acc, b) => acc + Number(b.currentBalance || 0), 0);
        const unmatchedTxns = bankTransactions.filter(t => t.matchStatus !== 'Matched').length;

        return {
          totalDonations,
          totalReceipts: fyReceipts.length,
          totalUtilised,
          remainingFunds,
          totalBankBalance,
          unmatchedTxns,
          totalActivitiesCount
        };

    // =========================================================================
    // SECTION 2 & 5: DONATION RECEIPTS (INDIAN FY HIERARCHY + AUDIT TRAIL)
    // =========================================================================
    function SectionDonationReceipts({
      receipts,
      setReceipts,
      selectedFY,
      setSelectedFY,
      selectedMonth,
      setSelectedMonth,
      selectedDate,
      setSelectedDate,
      globalSearch,
      onViewReceipt,
      onOpenCreateReceipt,
      onOpenActivities,
      notify
    }) {

      // Extract unique dates for the selected Month & FY
      const datesInMonth = useMemo(() => {
        const matching = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth);
        const unique = Array.from(new Set(matching.map(r => r.date))).sort().reverse();
        return unique;
      }, [receipts, selectedFY, selectedMonth]);

      // Filtered records
      const displayReceipts = useMemo(() => {
        return receipts.filter(r => {
          if (globalSearch.trim()) {
            const q = globalSearch.toLowerCase();
            return (
              r.receiptNo.toLowerCase().includes(q) ||
              r.donorName.toLowerCase().includes(q) ||
              (r.mobile && r.mobile.includes(q)) ||
              (r.pan && r.pan.toLowerCase().includes(q)) ||
              (r.purpose && r.purpose.toLowerCase().includes(q))
            );
          }
          if (selectedDate) return r.financialYear === selectedFY && r.date === selectedDate;
          return r.financialYear === selectedFY && r.month === selectedMonth;
        });
      }, [receipts, selectedFY, selectedMonth, selectedDate, globalSearch]);

      const handleCancelReceipt = (receiptId) => {
        const reason = prompt("Enter official cancellation reason for audit records:");
        if (!reason) return;
        setReceipts(receipts.map(r => r.id === receiptId ? { ...r, status: 'Cancelled', cancelReason: reason } : r));
        notify("Receipt cancelled and retained in audit history.", "error");
      };

      return (
        <div className="space-y-6">
          
          {/* Header & Controls */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Donation Receipts Register</h2>
              <p className="text-xs text-slate-500">
                Organised: Financial Year ({selectedFY}) → Month ({selectedMonth}) {selectedDate && `→ Date (${selectedDate})`}
              </p>
            </div>
            <button
              onClick={onOpenCreateReceipt}
              className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 self-start md:self-auto"
            >
              <span>➕</span>
              <span>Create Donation Receipt</span>
            </button>
          </div>

          {/* Month Selector Pills (April - March) */}
          <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm overflow-x-auto flex items-center gap-1.5">
            {FY_MONTHS.map(m => {
              const count = receipts.filter(r => r.financialYear === selectedFY && r.month === m).length;
              return (
                <button
                  key={m}
                  onClick={() => { setSelectedMonth(m); setSelectedDate(""); }}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition flex items-center gap-1.5 ${
                    selectedMonth === m 
                      ? 'bg-[#10141E] text-white shadow' 
                      : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <span>{m}</span>
                  {count > 0 && (
                    <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${selectedMonth === m ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-700'}`}>
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          {/* Date Selector Pills (Chronological) */}
          {datesInMonth.length > 0 && (
            <div className="flex items-center gap-2 overflow-x-auto text-xs py-1">
              <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Filter Date:</span>
              <button
                onClick={() => setSelectedDate("")}
                className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                  !selectedDate ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                }`}
              >
                All Dates in {selectedMonth}
              </button>
              {datesInMonth.map(d => (
                <button
                  key={d}
                  onClick={() => setSelectedDate(d)}
                  className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                    selectedDate === d ? 'bg-[#E22D4E] text-white' : 'bg-white border text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  {d}
                </button>
              ))}
            </div>
          )}

          {/* Clean Receipt List Table (Section 5) */}
          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
              <span className="text-xs font-extrabold text-slate-800">
                Displaying {displayReceipts.length} Donation Receipts
              </span>
              <span className="text-xs text-slate-500">
                Total Collection: <strong className="text-slate-900">₹{displayReceipts.reduce((a,c) => a + (c.status !== 'Cancelled' ? Number(c.amount) : 0), 0).toLocaleString()}</strong>
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider">
                  <tr>
                    <th className="py-3 px-4">S.No.</th>
                    <th className="py-3 px-4">Receipt No.</th>
                    <th className="py-3 px-4">Date</th>
                    <th className="py-3 px-4">Donor Name</th>
                    <th className="py-3 px-4">Mobile</th>
                    <th className="py-3 px-4">Purpose</th>
                    <th className="py-3 px-4">Mode</th>
                    <th className="py-3 px-4">Amount</th>
                    <th className="py-3 px-4 text-center">Activities</th>
                    <th className="py-3 px-4 text-right">Receipt Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {displayReceipts.length === 0 ? (
                    <tr>
                      <td colSpan="10" className="py-12 text-center text-slate-400">
                        No receipts found for this selection. Click <strong>"Create Donation Receipt"</strong> to add an entry.
                      </td>
                    </tr>
                  ) : (
                    displayReceipts.map((r, idx) => {
                      const isCancelled = r.status === 'Cancelled';
                      const actCount = (r.activities || []).length;
                      const actUtilised = (r.activities || []).reduce((a,c) => a + Number(c.amountUtilised || 0), 0);

                      return (
                        <tr key={r.id} className={`hover:bg-slate-50/80 transition ${isCancelled ? 'bg-rose-50/30' : ''}`}>
                          <td className="py-3.5 px-4 font-bold text-slate-400">{idx + 1}</td>
                          <td className="py-3.5 px-4 font-mono font-bold text-slate-900">
                            {r.receiptNo}
                            {isCancelled && <span className="ml-1.5 text-[10px] bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded">Cancelled</span>}
                          </td>
                          <td className="py-3.5 px-4 text-slate-600">{r.date}</td>
                          <td className="py-3.5 px-4">
                            <div className="font-bold text-slate-900">{r.donorName}</div>
                            {r.pan && <div className="text-[10px] text-slate-400">PAN: {r.pan}</div>}
                          </td>
                          <td className="py-3.5 px-4">{r.mobile}</td>
                          <td className="py-3.5 px-4 text-slate-700">{r.purpose}</td>
                          <td className="py-3.5 px-4">{r.paymentMode}</td>
                          <td className="py-3.5 px-4 font-extrabold text-slate-900">₹{r.amount.toLocaleString()}</td>
                          
                          {/* Activities Button directly linked to each receipt */}
                          <td className="py-3.5 px-4 text-center">
                            <button
                              onClick={() => onOpenActivities(r)}
                              className="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-[11px] font-bold border border-amber-200 transition inline-flex items-center gap-1"
                              title="Manage activities and bills for this donation"
                            >
                              <span>🎯 Activities</span>
                              {actCount > 0 && <span className="bg-amber-600 text-white rounded-full px-1.5 text-[9px]">{actCount}</span>}
                            </button>
                            {actCount > 0 && (
                              <div className="text-[9px] text-slate-400 mt-0.5">₹{actUtilised.toLocaleString()} spent</div>
                            )}
                          </td>

                          {/* Action Options */}
                          <td className="py-3.5 px-4 text-right space-x-1.5 whitespace-nowrap">
                            <button
                              onClick={() => onViewReceipt(r)}
                              className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-[11px]"
                              title="View & Download PDF"
                            >
                              View PDF
                            </button>

                            <button
                              onClick={() => {
                                const msg = `Dear ${r.donorName}, thank you for your generous contribution of Rs. ${r.amount} to Save The People Charitable Trust. Receipt No: ${r.receiptNo}. Download your 80G Tax Exemption Receipt.`;
                                window.open(`https://wa.me/${r.mobile.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
                              }}
                              className="px-2 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-[#00A859] font-bold text-[11px]"
                              title="Share on WhatsApp"
                            >
                              WhatsApp
                            </button>

                            {r.email && (
                              <button
                                onClick={() => {
                                  alert(`Official Receipt Email with attached PDF queued for: ${r.email}\nSubject: Donation Receipt – SAVE THE PEOPLE CHARITABLE TRUST`);
                                  notify(`Receipt sent to ${r.email}`);
                                }}
                                className="px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-[11px]"
                                title="Send Email"
                              >
                                Email
                              </button>
                            )}

                            {!isCancelled && (
                              <button
                                onClick={() => handleCancelReceipt(r.id)}
                                className="px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-[11px]"
                                title="Cancel receipt (keeps in audit log)"
                              >
                                Cancel
                              </button>
                            )}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // =========================================================================
    // SECTION 7: ACTIVITIES (RECEIPT-LINKED + BILLS / PHOTO EVIDENCE)
    // =========================================================================
    function ReceiptActivityModal({ receipt, onClose, onAddActivity }) {
      const [isAdding, setIsAdding] = useState(false);
      const [actDate, setActDate] = useState(new Date().toISOString().slice(0, 10));
      const [actName, setActName] = useState('');
      const [actCategory, setActCategory] = useState(ACTIVITY_CATEGORIES[0]);
      const [actDesc, setActDesc] = useState('');
      const [actAmount, setActAmount] = useState('');
      const [beneficiary, setBeneficiary] = useState('');
      const [uploadedFiles, setUploadedFiles] = useState([]);

      const activities = receipt.activities || [];
      const totalDonation = Number(receipt.amount || 0);
      const totalUtilised = activities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0);
      const remainingAmount = totalDonation - totalUtilised;

      const handleSave = (e) => {
        e.preventDefault();
        const amt = Number(actAmount);
        if (!amt || isNaN(amt)) {
          alert('Please enter a valid utilized amount.');
          return;
        }

        const newAct = {
          id: `ACT-${Date.now()}`,
          date: actDate,
          name: actName,
          category: actCategory,
          note: actDesc,
          amountUtilised: amt,
          beneficiary: beneficiary || 'Confidential Beneficiary',
          files: uploadedFiles.length > 0 ? uploadedFiles : ['support_bill_1.pdf']
        };

        onAddActivity(newAct);
        setIsAdding(false);
        setActName('');
        setActDesc('');
        setActAmount('');
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-3xl w-full shadow-2xl p-6 space-y-6">
            
            {/* Header */}
            <div className="flex justify-between items-start border-b border-slate-100 pb-4">
              <div>
                <span className="text-[10px] font-extrabold uppercase tracking-wider text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full">
                  Receipt-Linked Activities
                </span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">
                  Activities for Receipt: {receipt.receiptNo}
                </h3>
                <p className="text-xs text-slate-500">
                  Donor: <strong>{receipt.donorName}</strong> • Purpose: <strong>{receipt.purpose}</strong>
                </p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            {/* Fund Balance Banner */}
            <div className="grid grid-cols-3 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-100 text-center">
              <div>
                <span className="text-[10px] font-bold uppercase text-slate-400">Total Donation</span>
                <p className="text-lg font-extrabold text-slate-900">₹{totalDonation.toLocaleString()}</p>
              </div>
              <div>
                <span className="text-[10px] font-bold uppercase text-slate-400">Total Utilised</span>
                <p className="text-lg font-extrabold text-[#E22D4E]">₹{totalUtilised.toLocaleString()}</p>
              </div>
              <div>
                <span className="text-[10px] font-bold uppercase text-slate-400">Remaining Balance</span>
                <p className="text-lg font-extrabold text-[#00A859]">₹{remainingAmount.toLocaleString()}</p>
              </div>
            </div>

            {/* Add Activity Button or Form */}
            {!isAdding ? (
              <div className="flex justify-between items-center">
                <h4 className="font-extrabold text-sm text-slate-800">Linked Expenditures & Ground Proofs</h4>
                <button
                  onClick={() => setIsAdding(true)}
                  className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-bold text-xs px-4 py-2 rounded-xl transition"
                >
                  + Add Activity to this Donation
                </button>
              </div>
            ) : (
              <form onSubmit={handleSave} className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
                <h4 className="font-bold text-xs uppercase tracking-wider text-slate-900">New Ground Activity & Proof Entry</h4>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Activity Date *</label>
                    <input required type="date" value={actDate} onChange={e => setActDate(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Category *</label>
                    <select value={actCategory} onChange={e => setActCategory(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold">
                      {ACTIVITY_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Activity Name / Subject *</label>
                    <input required type="text" placeholder="e.g. School Books & Bag Kit" value={actName} onChange={e => setActName(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold" />

                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Beneficiary Name (Optional)</label>

                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Short Activity Note / Report *</label>
                  <textarea required rows="2" placeholder="Describe how the donation was utilized on the ground..." value={actDesc} onChange={e => setActDesc(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold"></textarea>

                  <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Upload Bill / Photos / Evidence (Camera / File)</label>
                  <input

                    multiple

                      const names = Array.from(e.target.files).map(f => f.name);

                    }}

                    <p className="text-[10px] text-emerald-600 font-bold mt-1">✓ {uploadedFiles.join(', ')}</p>

                    Cancel

                    Save Activity

                  No activities linked to this donation receipt yet. Click "+ Add Activity to this Donation" above.
                </div>
              ) : (
                activities.map(a => (
                  <div key={a.id} className="p-4 rounded-2xl border border-slate-100 bg-white shadow-sm flex flex-col md:flex-row justify-between gap-3 items-start md:items-center">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full">{a.date}</span>
                        <span className="text-xs font-extrabold text-slate-900">{a.name}</span>
                        <span className="text-[10px] text-rose-600 font-bold">({a.category})</span>
                      </div>
                      <p className="text-xs text-slate-600 mt-1">{a.note}</p>
                      <div className="text-[10px] text-slate-400 mt-1">
                        Beneficiary: <strong className="text-slate-700">{a.beneficiary || 'Verified Beneficiary'}</strong> • 
                        Documents: <span className="text-blue-600">{(a.files || []).join(', ')}</span>
                      </div>
                    </div>

                    <div className="text-right shrink-0">
                      <span className="text-sm font-extrabold text-[#E22D4E]">₹{a.amountUtilised.toLocaleString()}</span>
                    </div>

                ))
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 8: ACTIVITIES - MAIN OVERVIEW MENU
    // =========================================================================
    function SectionActivitiesMain({ receipts, selectedFY }) {
      const allActivities = useMemo(() => {
        let list = [];
        receipts.forEach(r => {
          (r.activities || []).forEach(a => {
            list.push({ ...a, receiptNo: r.receiptNo, donorName: r.donorName, financialYear: r.financialYear });
          });
        });
        return list.filter(a => a.financialYear === selectedFY);
      }, [receipts, selectedFY]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">All Field Activities & Proofs</h2>
              <p className="text-xs text-slate-500">Cross-donation expenditure reports and photographic evidence (FY {selectedFY})</p>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-400 font-bold">Total Ground Deployment</span>
              <p className="text-xl font-extrabold text-[#E22D4E]">
                ₹{allActivities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0).toLocaleString()}
              </p>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider">
                  <tr>
                    <th className="py-3 px-5">Date</th>
                    <th className="py-3 px-5">Activity Name</th>
                    <th className="py-3 px-5">Category</th>
                    <th className="py-3 px-5">Related Receipt</th>
                    <th className="py-3 px-5">Donor Earmark</th>
                    <th className="py-3 px-5">Beneficiary Info</th>
                    <th className="py-3 px-5">Amount Utilised</th>
                    <th className="py-3 px-5">Evidence Docs</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {allActivities.length === 0 ? (
                    <tr>
                      <td colSpan="8" className="py-12 text-center text-slate-400">
                        No activities logged for this financial year yet. Open any donation receipt to link an activity.
                      </td>
                    </tr>
                  ) : (
                    allActivities.map((a, idx) => (
                      <tr key={idx} className="hover:bg-slate-50 transition">
                        <td className="py-3 px-5 font-mono text-slate-700">{a.date}</td>
                        <td className="py-3 px-5">
                          <div className="font-bold text-slate-900">{a.name}</div>
                          <div className="text-[11px] text-slate-500">{a.note}</div>
                        </td>
                        <td className="py-3 px-5 font-bold text-rose-600">{a.category}</td>
                        <td className="py-3 px-5 font-mono text-blue-600 font-bold">{a.receiptNo}</td>
                        <td className="py-3 px-5">{a.donorName}</td>

                        <td className="py-3 px-5 font-extrabold text-slate-900">₹{a.amountUtilised.toLocaleString()}</td>
                        <td className="py-3 px-5">
                          <span className="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded text-[10px] font-bold">

    // =========================================================================
    // SECTION 9 & 10: BANK STATEMENTS MANAGEMENT & RECONCILIATION
    // =========================================================================
    function SectionBankStatements({
      bankAccounts,
      setBankAccounts,
      bankTransactions,
      setBankTransactions,
      receipts,
      selectedFY,
      notify
    }) {
      const [isAddingTxn, setIsAddingTxn] = useState(false);
      const [txnDate, setTxnDate] = useState(new Date().toISOString().slice(0, 10));
      const [txnDesc, setTxnDesc] = useState('');
      const [txnRef, setTxnRef] = useState('');
      const [txnCredit, setTxnCredit] = useState('');
      const [txnDebit, setTxnDebit] = useState('');

      const handleAddTxn = (e) => {
        e.preventDefault();
        const credit = Number(txnCredit || 0);
        const debit = Number(txnDebit || 0);

        // Check if there is a matching receipt automatically
        const matched = receipts.find(r => r.amount === credit && (r.refNo === txnRef || r.paymentMode === 'UPI' || r.paymentMode === 'Bank Transfer'));

        const newT = {
          id: `TXN-${Date.now()}`,
          date: txnDate,
          desc: txnDesc,
          ref: txnRef,
          credit,
          debit,
          balance: 145000 + credit - debit,
          matchStatus: matched ? "Matched" : "Pending Verification",
          receiptNo: matched ? matched.receiptNo : ""
        };

        setBankTransactions([newT, ...bankTransactions]);
        setIsAddingTxn(false);
        setTxnDesc('');
        setTxnRef('');
        setTxnCredit('');
        setTxnDebit('');
        notify("Bank statement transaction recorded and reconciled!");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Bank Statement Reconciliation</h2>
              <p className="text-xs text-slate-500">Auto-match bank credits with donation receipts to avoid duplicate income.</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setIsAddingTxn(true)}
                className="bg-[#10141E] hover:bg-[#E22D4E] text-white font-bold text-xs px-4 py-2.5 rounded-xl transition"
              >
                + Manual Bank Entry
              </button>
            </div>
          </div>

          {/* Bank Accounts Grid */}
          <div className="grid md:grid-cols-2 gap-4">
            {bankAccounts.map(b => (
              <div key={b.id} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-2">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-900">{b.bankName}</h3>
                    <p className="text-xs text-slate-400">A/C: {b.accountNo} • IFSC: {b.ifsc}</p>
                  </div>
                  <span className="text-[10px] font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">{b.type}</span>
                </div>
                <div className="pt-2 flex justify-between items-end border-t border-slate-100">
                  <div>
                    <span className="text-[10px] text-slate-400 font-bold uppercase">Current Book Balance</span>
                    <p className="text-lg font-extrabold text-slate-900">₹{b.currentBalance.toLocaleString()}</p>
                  </div>
                  <span className="text-xs text-[#00A859] font-bold">✓ Active</span>
                </div>
              </div>
            ))}
          </div>

          {/* Manual Entry Form */}
          {isAddingTxn && (
            <form onSubmit={handleAddTxn} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-xs uppercase text-slate-900">Enter Statement Transaction</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Date</label>
                  <input required type="date" value={txnDate} onChange={e => setTxnDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">UTR / Ref No</label>
                  <input required type="text" placeholder="e.g. UTR/902188" value={txnRef} onChange={e => setTxnRef(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Credit Amount (₹)</label>
                  <input type="number" placeholder="5000" value={txnCredit} onChange={e => setTxnCredit(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-emerald-600" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Debit Amount (₹)</label>
                  <input type="number" placeholder="0" value={txnDebit} onChange={e => setTxnDebit(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-rose-600" />
                </div>
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Particulars / Description</label>
                <input required type="text" placeholder="e.g. UPI/Priya Sharma/Donation" value={txnDesc} onChange={e => setTxnDesc(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
              </div>
              <div className="flex justify-end gap-2">
                <button type="button" onClick={() => setIsAddingTxn(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                <button type="submit" className="bg-[#E22D4E] text-white px-5 py-2 rounded-xl text-xs font-bold">Save Transaction</button>
              </div>
            </form>
          )}

          {/* Statement Reconciliation Table */}
          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
              <span className="text-xs font-bold text-slate-800">Verified Bank Ledger Records</span>
              <button 
                onClick={() => {
                  const csv = "Date,Description,UTR,Credit,Debit,Status\n" + bankTransactions.map(t => `${t.date},"${t.desc}",${t.ref},${t.credit},${t.debit},${t.matchStatus}`).join('\n');
                  const blob = new Blob([csv], { type: 'text/csv' });
                  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bank_statement.csv'; a.click();
                }}
                className="text-xs font-bold text-[#E22D4E] hover:underline"
              >
                Download Statement (CSV) ↓
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider">
                  <tr>
                    <th className="py-3 px-5">Date</th>
                    <th className="py-3 px-5">Description</th>
                    <th className="py-3 px-5">UTR / Reference</th>
                    <th className="py-3 px-5">Credit</th>
                    <th className="py-3 px-5">Debit</th>
                    <th className="py-3 px-5">Matching Status</th>
                    <th className="py-3 px-5">Linked Receipt</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {bankTransactions.map(t => (
                    <tr key={t.id} className="hover:bg-slate-50 transition">
                      <td className="py-3 px-5 font-mono text-slate-700">{t.date}</td>
                      <td className="py-3 px-5 font-bold text-slate-800">{t.desc}</td>
                      <td className="py-3 px-5 font-mono text-slate-500">{t.ref}</td>
                      <td className="py-3 px-5 font-extrabold text-[#00A859]">
                        {t.credit > 0 ? `₹${t.credit.toLocaleString()}` : '—'}
                      </td>
                      <td className="py-3 px-5 font-extrabold text-rose-600">
                        {t.debit > 0 ? `₹${t.debit.toLocaleString()}` : '—'}
                      </td>
                      <td className="py-3 px-5">
                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                          t.matchStatus === 'Matched' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                          {t.matchStatus}
                        </span>
                      </td>
                      <td className="py-3 px-5 font-mono text-xs font-bold text-blue-600">
                        {t.receiptNo || 'Unassigned'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 11 & 12: FINANCIAL REPORTS (CONSOLIDATED MONTHLY & YEARLY)
    // =========================================================================
    function SectionFinancialReports({ receipts, bankAccounts, bankTransactions, selectedFY, selectedMonth, setSelectedMonth, orgSettings, notify }) {
      const monthReceipts = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth && r.status !== 'Cancelled');
      const totalMonthDonations = monthReceipts.reduce((a,c) => a + Number(c.amount || 0), 0);
      
      let monthActivities = [];
      monthReceipts.forEach(r => {
        (r.activities || []).forEach(a => monthActivities.push({ ...a, receiptNo: r.receiptNo, donorName: r.donorName }));
      });
      const totalMonthUtilised = monthActivities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0);

      const downloadConsolidatedExcel = (isFullYear = false) => {
        const title = isFullYear ? `Full_FY_${selectedFY}_Consolidated_Report` : `Monthly_Report_${selectedMonth}_${selectedFY}`;
        const lines = [
          `SAVE THE PEOPLE CHARITABLE TRUST - CONSOLIDATED AUDIT REPORT (${title})`,
          `Registration: ${orgSettings.regNo} | PAN: ${orgSettings.orgPan} | 80G: ${orgSettings.section80G}`,
          `Generated On: ${new Date().toLocaleString()}`,
          "",
          "PART 1: DONATION RECEIPTS REGISTER",
          "Receipt No,Date,Donor Name,Mobile,PAN,Purpose,Payment Mode,Amount",
          ...receipts.filter(r => isFullYear ? r.financialYear === selectedFY : (r.financialYear === selectedFY && r.month === selectedMonth))
                     .map(r => `"${r.receiptNo}","${r.date}","${r.donorName}","${r.mobile}","${r.pan || ''}","${r.purpose}","${r.paymentMode}",${r.amount}`),
          "",
          "PART 2: GROUND ACTIVITIES & UTILISATION",
          "Date,Activity Name,Category,Receipt No,Donor Name,Beneficiary,Amount Utilised,Documents",
          ...monthActivities.map(a => `"${a.date}","${a.name}","${a.category}","${a.receiptNo}","${a.donorName}","${a.beneficiary}",${a.amountUtilised},"${(a.files||[]).join(';')}"`),
          "",
          "PART 3: FINANCIAL RECONCILIATION SUMMARY",
          `Total Donations Received,Rs. ${totalMonthDonations}`,
          `Total Amount Utilised,Rs. ${totalMonthUtilised}`,
          `Remaining Balance,Rs. ${totalMonthDonations - totalMonthUtilised}`
        ];

        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${title}.csv`;
        a.click();
        notify(`Consolidated ${title} downloaded successfully!`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Comprehensive Audit Reports</h2>
              <p className="text-xs text-slate-500">7-Part consolidated registers containing Receipts, Activities, Proofs, and Bank Summaries</p>
            </div>
            
            <div className="flex gap-2">
              <button
                onClick={() => downloadConsolidatedExcel(false)}
                className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow transition"
              >
                Download Monthly Report ({selectedMonth})
              </button>
              <button
                onClick={() => downloadConsolidatedExcel(true)}
                className="bg-[#10141E] hover:bg-black text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow transition"
              >
                Download Overall FY ({selectedFY}) Report
              </button>
            </div>
          </div>

          {/* Month Selector for Reports */}
          <div className="bg-white p-4 rounded-2xl border border-slate-100 flex items-center gap-2 overflow-x-auto text-xs">
            <span className="font-bold text-slate-400 uppercase text-[10px] shrink-0">Select Month:</span>
            {FY_MONTHS.map(m => (
              <button
                key={m}
                onClick={() => setSelectedMonth(m)}
                className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                  selectedMonth === m ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`}
              >
                {m}
              </button>
            ))}
          </div>

          {/* 7-PART REPORT PREVIEW CARDS */}
          <div className="grid md:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-2">
              <span className="text-[10px] font-bold uppercase text-slate-400">PART 1: DONATIONS SUMMARY</span>
              <p className="text-xl font-extrabold text-slate-900">₹{totalMonthDonations.toLocaleString()}</p>
              <p className="text-xs text-slate-500">{monthReceipts.length} Donors for {selectedMonth} {selectedFY}</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-2">
              <span className="text-[10px] font-bold uppercase text-slate-400">PART 2 & 3: ACTIVITIES DEPLOYED</span>
              <p className="text-xl font-extrabold text-[#E22D4E]">₹{totalMonthUtilised.toLocaleString()}</p>
              <p className="text-xs text-slate-500">{monthActivities.length} Field Activities Logged</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-2">
              <span className="text-[10px] font-bold uppercase text-slate-400">PART 5: NET SURPLUS / BALANCE</span>
              <p className="text-xl font-extrabold text-[#00A859]">₹{(totalMonthDonations - totalMonthUtilised).toLocaleString()}</p>
              <p className="text-xs text-slate-500">100% Retained in Trust Accounts</p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 15: RECEIPT & ORGANISATION SETTINGS
    // =========================================================================
    function SectionSettings({ orgSettings, setOrgSettings, notify }) {
      const [form, setForm] = useState(orgSettings);

      const handleSave = (e) => {
        e.preventDefault();
        setOrgSettings(form);
        notify("Organisation & 80G receipt settings saved successfully!");
      };

      return (
        <form onSubmit={handleSave} className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6 max-w-4xl">
          <div>
            <h2 className="text-xl font-extrabold text-slate-900">Organisation & 80G Settings</h2>
            <p className="text-xs text-slate-500">Maintains permanent legal Trust particulars rendered on all generated donation receipts.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold">
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Organisation Legal Name</label>
              <input type="text" value={form.orgName} onChange={e => setForm({ ...form, orgName: e.target.value })} className="w-full bg-slate-50 border rounded-xl px-3.5 py-2.5" />
            </div>

    // SECTION 3 & 4: CREATE DONATION RECEIPT ENTRY MODAL
    // =========================================================================
    function CreateReceiptModal({ orgSettings, receipts, onClose, onSave }) {
      const today = new Date().toISOString().slice(0, 10);
      const [receiptDate, setReceiptDate] = useState(today);
      const [donorName, setDonorName] = useState('');
      const [mobile, setMobile] = useState('');
      const [email, setEmail] = useState('');
      const [pan, setPan] = useState('');
      const [address, setAddress] = useState('');
      const [amount, setAmount] = useState('');
      const [purpose, setPurpose] = useState('General Donation');
      const [otherPurpose, setOtherPurpose] = useState('');
      const [paymentMode, setPaymentMode] = useState('UPI');
      const [refNo, setRefNo] = useState('');

      // Auto generate sequential receipt number
      const nextReceiptNumber = useMemo(() => {
        const count = receipts.length + 1;
        const padded = String(count).padStart(6, '0');
        return `${orgSettings.receiptPrefix}/${orgSettings.currentFY}/${padded}`;
      }, [receipts, orgSettings]);

      const amountWords = useMemo(() => {
        return numberToWordsINR(Number(amount));
      }, [amount]);

      const handleSubmit = (createNext = false) => {
        if (!donorName || !mobile || !amount) {
          alert('Please fill all mandatory fields (Donor Name, Mobile, Amount).');
          return;
        }

        const dateObj = new Date(receiptDate);
        const monthName = FY_MONTHS[dateObj.getMonth() >= 3 ? dateObj.getMonth() - 3 : dateObj.getMonth() + 9];

        const newRec = {
          id: `REC-${Date.now()}`,
          receiptNo: nextReceiptNumber,
          date: receiptDate,
          financialYear: orgSettings.currentFY,
          month: monthName,
          donorName,
          mobile,
          email,
          pan: pan ? pan.toUpperCase() : '',
          address,
          amount: Number(amount),
          amountInWords: amountWords,
          purpose: purpose === 'Other' ? otherPurpose : purpose,
          paymentMode,
          refNo: refNo || `${paymentMode}-VERIFIED`,
          status: 'Completed',
          activities: []
        };

        onSave(newRec, createNext);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5">
            
            {/* Header */}

              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-rose-600 bg-rose-50 px-2 py-0.5 rounded">
                  Auto Sequence No: {nextReceiptNumber}
                </span>
                <h3 className="text-lg font-extrabold text-slate-900 mt-1">Donation Receipt Entry</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); handleSubmit(false); }} className="space-y-4 text-xs font-semibold">
              
              {/* Part A & Date */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Receipt Date *</label>
                  <input required type="date" value={receiptDate} onChange={e => setReceiptDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Financial Year (Auto)</label>
                  <input disabled type="text" value={orgSettings.currentFY} className="w-full bg-slate-100 border rounded-xl px-3 py-2 text-xs font-bold text-slate-500" />
                </div>
              </div>

              {/* Part B: Donor Info */}
              <div className="space-y-3 pt-2 border-t border-slate-100">

                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Received With Thanks From (Donor Name) *</label>
                    <input required type="text" placeholder="e.g. Ramesh Kumar" value={donorName} onChange={e => setDonorName(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />

                  <strong>Amount in Words:</strong> {amountWords}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Payment Mode *</label>
                    <select value={paymentMode} onChange={e => setPaymentMode(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold">

      constructor(props) {

        this.state = { hasError: false, error: null }; 
      }
      static getDerivedStateFromError(error) { 
        return { hasError: true, error }; 
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Component Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-lg mx-auto my-12 bg-white rounded-3xl border border-rose-200 shadow-xl text-center space-y-4">
              <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>

              >
                Clear Local Cache & Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }
