    // --- NUMBER TO WORDS (INDIAN CURRENCY FORMAT) ---
    function numberToWordsINR(num) {
      if (!num || isNaN(num)) return "Zero Rupees Only";
      const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
      const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

      function inWords(n) {
        if ((n = n.toString()).length > 9) return 'overflow';
        let n_arr = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_arr) return '';
        let str = '';
        str += (n_arr[1] != 0) ? (a[Number(n_arr[1])] || b[n_arr[1][0]] + ' ' + a[n_arr[1][1]]) + 'Crore ' : '';
        str += (n_arr[2] != 0) ? (a[Number(n_arr[2])] || b[n_arr[2][0]] + ' ' + a[n_arr[2][1]]) + 'Lakh ' : '';
        str += (n_arr[3] != 0) ? (a[Number(n_arr[3])] || b[n_arr[3][0]] + ' ' + a[n_arr[3][1]]) + 'Thousand ' : '';
        str += (n_arr[4] != 0) ? (a[Number(n_arr[4])] || b[n_arr[4][0]] + ' ' + a[n_arr[4][1]]) + 'Hundred ' : '';
        str += (n_arr[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_arr[5])] || b[n_arr[5][0]] + ' ' + a[n_arr[5][1]]) : '';
        return str.trim();
      }
      return `${inWords(num)} Rupees Only`;
    }

    const ACTIVITY_CATEGORIES = [
      "Food Support",
      "Medical Care",
      "Child Education",
      "Family Support",
      "Women Empowerment",
      "Blood Donation Camp",
      "Health Camp",
      "Emergency Relief",
      "Other"
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Clean view state & sub-section from URL
      const parseInitialState = () => {
        const path = window.location.pathname.toLowerCase();
        const hash = window.location.hash.toLowerCase();
        const isAdmin = path.startsWith('/admin') || hash.startsWith('#admin');
        let sub = 'dashboard';
        if (isAdmin) {
          if (path.includes('/reports') || hash.includes('reports')) sub = 'reports';
          else if (path.includes('/receipts') || hash.includes('receipts')) sub = 'receipts';
          else if (path.includes('/statements') || hash.includes('statements')) sub = 'statements';
          else if (path.includes('/activities') || hash.includes('activities')) sub = 'activities';
          else if (path.includes('/settings') || hash.includes('settings')) sub = 'settings';
        }
        return { view: isAdmin ? 'admin' : 'public', sub };
      };

      const initialState = parseInitialState();
      const [view, setViewState] = useState(initialState.view);
      const [adminSubSection, setAdminSubSectionState] = useState(initialState.sub);

      const changeAdminSection = (sectionId) => {
        setAdminSubSectionState(sectionId);
        try {
          if (window.location.protocol.startsWith('http')) {
            const pathName = sectionId === 'dashboard' ? '/admin' : `/admin/${sectionId}`;
            window.history.pushState({}, '', pathName);
          } else {
            window.location.hash = sectionId === 'dashboard' ? 'admin' : `admin/${sectionId}`;
          }
        } catch(e) {}
      };

      // Listen for browser forward/back buttons
      useEffect(() => {
        const handlePopState = () => {
          const s = parseInitialState();
          setViewState(s.view);
          setAdminSubSectionState(s.sub);
        };
        window.addEventListener('popstate', handlePopState);
        window.addEventListener('hashchange', handlePopState);
        return () => {
          window.removeEventListener('popstate', handlePopState);
          window.removeEventListener('hashchange', handlePopState);
        };
      }, []);

      // Admin Authentication State
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        try {
          return sessionStorage.getItem('stp_admin') === 'true';
        } catch(e) { return false; }
      });
      const [loginUser, setLoginUser] = useState('admin');
      const [loginPass, setLoginPass] = useState('');
      const [showLoginPass, setShowLoginPass] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [isForgotModalOpen, setIsForgotModalOpen] = useState(false);
      const [forgotUser, setForgotUser] = useState('admin');
      const [forgotNewPass, setForgotNewPass] = useState('');
      const [forgotConfirmPass, setForgotConfirmPass] = useState('');
      const [forgotError, setForgotError] = useState('');

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const storedPass = localStorage.getItem('stp_admin_pass') || 'admin123';
        const valid = (
          (loginUser.trim().toLowerCase() === 'admin' && loginPass === storedPass) ||
          (loginUser.trim().toLowerCase() === 'savethepeople' && loginPass === 'savethepeople123')
        );

        if (valid) {
          try { sessionStorage.setItem('stp_admin', 'true'); } catch(err) {}
          setIsAdminLoggedIn(true);
          setLoginError('');
          notify(`Welcome back, ${loginUser}!`);
        } else {
          setLoginError('Invalid admin username or password. Default is admin / admin123');
        }
      };

      const handleAdminLogout = () => {
        try { sessionStorage.removeItem('stp_admin'); } catch(err) {}
        setIsAdminLoggedIn(false);
        setLoginPass('');
        notify("Logged out successfully");
      };

      const handleForgotSubmit = (e) => {
        e.preventDefault();
        if (forgotUser.trim().toLowerCase() !== 'admin') {
          setForgotError('Only "admin" password can be reset.');
          return;
        }
        if (forgotNewPass.length < 6) {
          setForgotError('Password must be at least 6 characters.');
          return;
        }
        if (forgotNewPass !== forgotConfirmPass) {
          setForgotError('Passwords do not match.');
          return;
        }
        localStorage.setItem('stp_admin_pass', forgotNewPass);
        setIsForgotModalOpen(false);
        setForgotNewPass('');
        setForgotConfirmPass('');
        setForgotError('');
        notify("Password updated successfully! You can now log in with your new password.");
      };

      // Master Records State
      const [orgSettings, setOrgSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('stp_org_settings');
          if (saved) {
            const parsed = JSON.parse(saved);
            // Ensure official Andhra Pradesh / Kakinada details & J. Sudheer are set
            return {
              ...DEFAULT_ORG_SETTINGS,
              ...parsed,
              trusteeName: "J. Sudheer",
              orgName: DEFAULT_ORG_SETTINGS.orgName,
              regNo: DEFAULT_ORG_SETTINGS.regNo,
              orgPan: DEFAULT_ORG_SETTINGS.orgPan,
              address: DEFAULT_ORG_SETTINGS.address,
              phone: DEFAULT_ORG_SETTINGS.phone,
              email: DEFAULT_ORG_SETTINGS.email,
              section80G: DEFAULT_ORG_SETTINGS.section80G,
              section80GValidity: DEFAULT_ORG_SETTINGS.section80GValidity
            };
          }
          return DEFAULT_ORG_SETTINGS;
        } catch(e) { return DEFAULT_ORG_SETTINGS; }
      });

      const [receipts, setReceipts] = useState(() => {
        try {
          const saved = localStorage.getItem('stp_receipts');
          if (saved) {
            let parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              // Auto-migrate / fix: If 2021-22 receipts were previously saved starting with 000005, re-align them to start from 000001
              const first2122 = parsed.find(r => r.financialYear === '2021-22');
              if (first2122 && first2122.receiptNo === 'STPCT/2021-22/000005') {
                const fyCounts = {};
                parsed = parsed.map(r => {
                  const fy = r.financialYear || '2021-22';
                  fyCounts[fy] = (fyCounts[fy] || 0) + 1;
                  const seq = String(fyCounts[fy]).padStart(6, '0');
                  const prefix = (r.receiptNo && r.receiptNo.split('/')[0]) || 'STPCT';
                  return {
                    ...r,
                    receiptNo: `${prefix}/${fy}/${seq}`
                  };
                });
                try { localStorage.setItem('stp_receipts', JSON.stringify(parsed)); } catch(e) {}
              }
              return parsed;
            }
          }
          return INITIAL_RECEIPTS;
        } catch(e) { 
          return INITIAL_RECEIPTS; 
        }
      });

      const [bankAccounts, setBankAccounts] = useState(() => {
        try {
          const saved = localStorage.getItem('stp_bank_accounts_v2');
          return saved ? JSON.parse(saved) : INITIAL_BANK_ACCOUNTS;
        } catch(e) { return INITIAL_BANK_ACCOUNTS; }
      });

      const [bankTransactions, setBankTransactions] = useState(() => {
        try {
          const saved = localStorage.getItem('stp_bank_transactions_v2');
          return saved ? JSON.parse(saved) : INITIAL_BANK_TRANSACTIONS;
        } catch(e) { return INITIAL_BANK_TRANSACTIONS; }
      });

      // Selected FY, Month, Date hierarchy filter
      const [selectedFY, setSelectedFY] = useState("2026-27");
      const [selectedMonth, setSelectedMonth] = useState("November");
      const [selectedDate, setSelectedDate] = useState("");

      // Global Search Bar
      const [globalSearch, setGlobalSearch] = useState("");

      // Modals
      const [activeReceiptModal, setActiveReceiptModal] = useState(null); // Full Receipt View / Print Modal
      const [isCreateReceiptOpen, setIsCreateReceiptOpen] = useState(false);
      const [receiptActivityTarget, setReceiptActivityTarget] = useState(null); // Receipt linked to Add Activity
      const [notification, setNotification] = useState(null);

      // Persist receipts
      useEffect(() => {
        try {
          localStorage.setItem('stp_receipts', JSON.stringify(receipts));
        } catch(e) {}
      }, [receipts]);

      useEffect(() => {
        try {
          localStorage.setItem('stp_org_settings', JSON.stringify(orgSettings));
        } catch(e) {}
      }, [orgSettings]);

      useEffect(() => {
        try {
          localStorage.setItem('stp_bank_accounts_v2', JSON.stringify(bankAccounts));
        } catch(e) {}
      }, [bankAccounts]);

      useEffect(() => {
        try {
          localStorage.setItem('stp_bank_transactions_v2', JSON.stringify(bankTransactions));
        } catch(e) {}
      }, [bankTransactions]);

      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const setView = (newView) => {
        setViewState(newView);
        try {
          if (window.location.protocol.startsWith('http')) {
            window.history.pushState({}, '', newView === 'admin' ? '/admin' : '/');
          } else {
            window.location.hash = newView === 'admin' ? 'admin' : '';
          }
        } catch(e) {}
      };

      // --- FINANCIAL YEAR TOTALS & CALCULATIONS ---
      const fyTotals = useMemo(() => {
        const fyReceipts = receipts.filter(r => r.financialYear === selectedFY && r.status !== 'Cancelled');
        const totalDonations = fyReceipts.reduce((acc, r) => acc + Number(r.amount || 0), 0);
        
        let totalUtilised = 0;
        let totalActivitiesCount = 0;
        fyReceipts.forEach(r => {
          (r.activities || []).forEach(a => {
            totalUtilised += Number(a.amountUtilised || 0);
            totalActivitiesCount++;
          });
        });

        const remainingFunds = totalDonations - totalUtilised;
        const totalBankBalance = bankAccounts.reduce((acc, b) => acc + Number(b.currentBalance || 0), 0);
        const unmatchedTxns = bankTransactions.filter(t => t.matchStatus !== 'Matched').length;

        return {
          totalDonations,
          totalReceipts: fyReceipts.length,
          totalUtilised,
          remainingFunds,
          totalBankBalance,
          unmatchedTxns,
          totalActivitiesCount
        };
      }, [receipts, bankAccounts, bankTransactions, selectedFY]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-6 right-6 z-50 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-white transition-all transform animate-bounce ${
              notification.type === 'success' ? 'bg-[#00A859]' : 'bg-[#E22D4E]'
            }`}>
              <span className="text-base">{notification.type === 'success' ? '✓' : '⚠️'}</span>
              <span className="font-semibold text-sm">{notification.msg}</span>
            </div>
          )}

          {/* PUBLIC vs ADMIN ROUTER */}
          {view === 'public' ? (
            <PublicLandingView onOpenAdmin={() => setView('admin')} />
          ) : !isAdminLoggedIn ? (
            /* ADMIN LOGIN GATEWAY */
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
              <div className="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full space-y-6">
                
                {/* Logo & Shield Icon */}
                <div className="text-center space-y-2">
                  <div className="w-16 h-16 rounded-2xl bg-rose-50 text-[#E22D4E] flex items-center justify-center mx-auto text-2xl font-bold shadow-sm">
                    🛡️
                  </div>
                  <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Control Center</h2>
                  <p className="text-xs text-slate-500">Sign in to manage donations, verify receipts, and launch campaigns.</p>
                </div>

                {/* Login Form */}
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">
                      Admin Username
                    </label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-2.5 text-slate-400 text-sm">👤</span>
                      <input
                        required
                        type="text"
                        value={loginUser}
                        onChange={e => setLoginUser(e.target.value)}
                        placeholder="admin"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#E22D4E]"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-500">
                        Password
                      </label>
                      <button
                        type="button"
                        onClick={() => setIsForgotModalOpen(true)}
                        className="text-[11px] font-bold text-[#E22D4E] hover:underline"
                      >
                        Reset Password?
                      </button>
                    </div>

                    <div className="relative">
                      <span className="absolute left-3.5 top-2.5 text-slate-400 text-sm">🔒</span>
                      <input
                        required
                        type={showLoginPass ? "text" : "password"}
                        value={loginPass}
                        onChange={e => setLoginPass(e.target.value)}
                        placeholder="Enter password (e.g. admin123)"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-14 py-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#E22D4E]"
                      />
                      <button
                        type="button"
                        onClick={() => setShowLoginPass(!showLoginPass)}
                        className="absolute right-3 top-2.5 text-xs font-bold text-slate-500 hover:text-slate-800"
                      >
                        {showLoginPass ? "Hide" : "View"}
                      </button>
                    </div>
                  </div>

                  {loginError && (
                    <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs font-semibold text-rose-600 flex items-center gap-2">
                      <span>⚠️</span>
                      <span>{loginError}</span>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full bg-[#10141E] hover:bg-[#E22D4E] text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition duration-200 text-sm"
                  >
                    Sign In to Dashboard
                  </button>
                </form>

                {/* Back to Website */}
                <div className="text-center pt-2">
                  <button
                    onClick={() => setView('public')}
                    className="text-xs font-bold text-slate-500 hover:text-slate-800 transition"
                  >
                    ← Back to Public Website
                  </button>
                </div>
              </div>

              {/* Forgot / Reset Password Modal */}
              {isForgotModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-left">
                    <div className="flex justify-between items-center border-b pb-3">
                      <div>
                        <h3 className="font-extrabold text-base text-slate-900">Reset Admin Password</h3>
                        <p className="text-xs text-slate-500">Update your administrator security credentials</p>
                      </div>
                      <button onClick={() => setIsForgotModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                    </div>

                    <form onSubmit={handleForgotSubmit} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Admin Username</label>
                        <input
                          type="text"
                          value={forgotUser}
                          onChange={e => setForgotUser(e.target.value)}
                          className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-semibold"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">New Password</label>
                        <input
                          type="password"
                          placeholder="At least 6 characters"
                          value={forgotNewPass}
                          onChange={e => setForgotNewPass(e.target.value)}
                          className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-semibold"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Confirm New Password</label>
                        <input
                          type="password"
                          placeholder="Repeat new password"
                          value={forgotConfirmPass}
                          onChange={e => setForgotConfirmPass(e.target.value)}
                          className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-semibold"
                          required
                        />
                      </div>

                      {forgotError && (
                        <p className="text-xs font-bold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-100">
                          {forgotError}
                        </p>
                      )}

                      <div className="flex gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setIsForgotModalOpen(false)}
                          className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 bg-[#E22D4E] hover:bg-[#c92040] text-white text-xs font-bold py-2.5 rounded-xl shadow"
                        >
                          Save Password
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          ) : (
            <AdminBillingSystem 
              adminSubSection={adminSubSection}
              setAdminSubSection={changeAdminSection}
              onBackToPublic={() => setView('public')}
              onLogout={handleAdminLogout}
              orgSettings={orgSettings}
              setOrgSettings={setOrgSettings}
              receipts={receipts}
              setReceipts={setReceipts}
              bankAccounts={bankAccounts}
              setBankAccounts={setBankAccounts}
              bankTransactions={bankTransactions}
              setBankTransactions={setBankTransactions}
              selectedFY={selectedFY}
              setSelectedFY={setSelectedFY}
              selectedMonth={selectedMonth}
              setSelectedMonth={setSelectedMonth}
              selectedDate={selectedDate}
              setSelectedDate={setSelectedDate}
              globalSearch={globalSearch}
              setGlobalSearch={setGlobalSearch}
              fyTotals={fyTotals}
              onViewReceipt={(r) => setActiveReceiptModal(r)}
              onOpenCreateReceipt={() => setIsCreateReceiptOpen(true)}
              onOpenActivitiesForReceipt={(r) => setReceiptActivityTarget(r)}
              notify={notify}
            />
          )}

          {/* VIEW / PRINT DONATION RECEIPT MODAL */}
          {activeReceiptModal && (
            <ReceiptViewModal 
              receipt={activeReceiptModal}
              orgSettings={orgSettings}
              setOrgSettings={setOrgSettings}
              onClose={() => setActiveReceiptModal(null)}
              notify={notify}
            />
          )}

          {/* CREATE DONATION RECEIPT MODAL */}
          {isCreateReceiptOpen && (
            <CreateReceiptModal 
              orgSettings={orgSettings}
              receipts={receipts}
              onClose={() => setIsCreateReceiptOpen(false)}
              onSave={(newRec, createNext = false) => {
                // Automatically insert and sort in clean chronological order by date
                const updated = [...receipts, newRec].sort((a, b) => {
                  const da = new Date(a.date).getTime() || 0;
                  const db = new Date(b.date).getTime() || 0;
                  return da - db;
                });
                setReceipts(updated);
                notify(`Receipt ${newRec.receiptNo} created successfully!`);
                if (!createNext) {
                  setIsCreateReceiptOpen(false);
                  setActiveReceiptModal(newRec); // Auto open PDF view
                }
              }}
            />
          )}

          {/* RECEIPT-LINKED ACTIVITIES MODAL */}
          {receiptActivityTarget && (
            <ReceiptActivityModal 
              receipt={receiptActivityTarget}
              onClose={() => setReceiptActivityTarget(null)}
              onAddActivity={(newAct) => {
                const updated = receipts.map(r => {
                  if (r.id === receiptActivityTarget.id) {
                    const acts = r.activities || [];
                    return { ...r, activities: [newAct, ...acts] };
                  }
                  return r;
                });
                setReceipts(updated);
                setReceiptActivityTarget({
                  ...receiptActivityTarget,
                  activities: [newAct, ...(receiptActivityTarget.activities || [])]
                });
                notify(`Activity "${newAct.name}" linked to ${receiptActivityTarget.receiptNo}!`);
              }}
            />
          )}

        </div>
      );
    }

    // =========================================================================
    // 2. ADMIN BILLING SYSTEM (FULL SPLIT NAVIGATION + 6 SECTIONS)
    // =========================================================================
    function AdminBillingSystem({
      adminSubSection,
      setAdminSubSection,
      onBackToPublic,
      onLogout,
      orgSettings,
      setOrgSettings,
      receipts,
      setReceipts,
      bankAccounts,
      setBankAccounts,
      bankTransactions,
      setBankTransactions,
      selectedFY,
      setSelectedFY,
      selectedMonth,
      setSelectedMonth,
      selectedDate,
      setSelectedDate,
      globalSearch,
      setGlobalSearch,
      fyTotals,
      onViewReceipt,
      onOpenCreateReceipt,
      onOpenActivitiesForReceipt,
      notify
    }) {

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F4F6F9]">
          
          {/* --- LEFT SIDEBAR (BILLING SECTIONS) --- */}
          <aside className="w-full md:w-72 bg-[#10141E] text-white shrink-0 flex flex-col justify-between border-r border-slate-800">
            <div className="p-6 space-y-7">
              
              {/* Trust Badge & Header */}
              <div className="flex items-center gap-3.5 pb-6 border-b border-slate-800">
                <img 
                  src="images/save_the_people_logo.jpeg" 
                  alt="Save The People" 
                  className="h-11 w-auto object-contain rounded-lg"
                  onError={e => e.target.style.display = 'none'}
                />
                <div className="overflow-hidden">
                  <h2 className="font-extrabold text-sm text-white truncate tracking-tight">SAVE THE PEOPLE</h2>
                  <p className="text-[10px] uppercase font-bold text-rose-500 tracking-wider">Charitable Trust</p>
                </div>
              </div>

              {/* Financial Year Selector */}
              <div className="bg-slate-900/90 p-3 rounded-2xl border border-slate-800 space-y-1">
                <label className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Financial Year</label>
                <select 
                  value={selectedFY} 
                  onChange={e => setSelectedFY(e.target.value)}
                  className="w-full bg-transparent text-xs font-bold text-amber-400 focus:outline-none cursor-pointer"
                >
                  {/* Dynamic Financial Years from imported data */}
                  {Array.from(new Set([selectedFY, "2026-27", "2025-26", "2024-25", "2023-24", "2022-23", "2021-22", ...receipts.map(r => r.financialYear).filter(Boolean)])).sort().reverse().map(fy => (
                    <option key={fy} value={fy} className="bg-slate-900">
                      FY {fy} {fy === "2026-27" ? "(Current)" : "(Records Archive)"}
                    </option>
                  ))}
                </select>
              </div>

              {/* Main Navigation (The 6 Prescribed Sections) */}
              <nav className="space-y-1.5">
                <p className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 px-3">
                  Admin Panel → Billing
                </p>

                {[
                  { id: 'dashboard', label: '1. Dashboard', icon: '📊' },
                  { id: 'receipts', label: '2. Donation Receipts', icon: '🧾' },
                  { id: 'statements', label: '3. Bank Statements', icon: '🏦' },
                  { id: 'activities', label: '4. Activities', icon: '🎯' },
                  { id: 'reports', label: '5. Financial Reports', icon: '📈' },
                  { id: 'settings', label: '6. Receipt & Org Settings', icon: '⚙️' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setAdminSubSection(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs font-bold transition ${
                      adminSubSection === item.id 
                        ? 'bg-[#E22D4E] text-white shadow-lg shadow-[#E22D4E]/30' 
                        : 'text-slate-400 hover:text-white hover:bg-white/5'
                    }`}
                  >
                    <span className="text-base">{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

            </div>

            {/* Sidebar Bottom CTA */}
            <div className="p-6 border-t border-slate-800 space-y-2.5">
              <button
                onClick={onOpenCreateReceipt}
                className="w-full bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs py-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2"
              >
                <span>➕</span>

    // =========================================================================
    // SECTION 2 & 5: DONATION RECEIPTS (INDIAN FY HIERARCHY + AUDIT TRAIL)
    // =========================================================================
    function SectionDonationReceipts({
      receipts,
      setReceipts,
      selectedFY,
      setSelectedFY,
      selectedMonth,
      setSelectedMonth,
      selectedDate,
      setSelectedDate,
      globalSearch,
      onViewReceipt,
      onOpenCreateReceipt,
      onOpenActivities,
      notify
    }) {

      // Extract unique dates for the selected Month & FY
      const datesInMonth = useMemo(() => {
        const matching = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth);
        const unique = Array.from(new Set(matching.map(r => r.date))).sort().reverse();
        return unique;
      }, [receipts, selectedFY, selectedMonth]);

      // Filtered records
      const displayReceipts = useMemo(() => {
        return receipts.filter(r => {
          if (globalSearch.trim()) {
            const q = globalSearch.toLowerCase();
            return (
              r.receiptNo.toLowerCase().includes(q) ||
              r.donorName.toLowerCase().includes(q) ||
              (r.mobile && r.mobile.includes(q)) ||
              (r.pan && r.pan.toLowerCase().includes(q)) ||
              (r.purpose && r.purpose.toLowerCase().includes(q))
            );
          }
          if (selectedDate) return r.financialYear === selectedFY && r.date === selectedDate;
          return r.financialYear === selectedFY && r.month === selectedMonth;
        });
      }, [receipts, selectedFY, selectedMonth, selectedDate, globalSearch]);

      const handleCancelReceipt = (receiptId) => {
        const reason = prompt("Enter official cancellation reason for audit records:");
        if (!reason) return;
        setReceipts(receipts.map(r => r.id === receiptId ? { ...r, status: 'Cancelled', cancelReason: reason } : r));
        notify("Receipt cancelled and retained in audit history.", "error");
      };

      return (
        <div className="space-y-6">
          
          {/* Header & Controls */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Donation Receipts Register</h2>
              <p className="text-xs text-slate-500">
                Organised: Financial Year ({selectedFY}) → Month ({selectedMonth}) {selectedDate && `→ Date (${selectedDate})`}
              </p>
            </div>
            <button
              onClick={onOpenCreateReceipt}
              className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 self-start md:self-auto"
            >
              <span>➕</span>
              <span>Create Donation Receipt</span>
            </button>
          </div>

          {/* Month Selector Pills (April - March) */}
          <div className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm overflow-x-auto flex items-center gap-1.5">
            {FY_MONTHS.map(m => {
              const count = receipts.filter(r => r.financialYear === selectedFY && r.month === m).length;
              return (
                <button
                  key={m}
                  onClick={() => { setSelectedMonth(m); setSelectedDate(""); }}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition flex items-center gap-1.5 ${
                    selectedMonth === m 
                      ? 'bg-[#10141E] text-white shadow' 
                      : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <span>{m}</span>
                  {count > 0 && (
                    <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${selectedMonth === m ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-700'}`}>
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          {/* Date Selector Pills (Chronological) */}
          {datesInMonth.length > 0 && (
            <div className="flex items-center gap-2 overflow-x-auto text-xs py-1">
              <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Filter Date:</span>
              <button
                onClick={() => setSelectedDate("")}
                className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                  !selectedDate ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                }`}
              >
                All Dates in {selectedMonth}
              </button>
              {datesInMonth.map(d => (
                <button
                  key={d}
                  onClick={() => setSelectedDate(d)}
                  className={`px-3 py-1.5 rounded-lg font-bold shrink-0 text-xs ${
                    selectedDate === d ? 'bg-[#E22D4E] text-white' : 'bg-white border text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  {d}
                </button>
              ))}
            </div>
          )}

          {/* Clean Receipt List Table (Section 5) */}
          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
              <span className="text-xs font-extrabold text-slate-800">
                Displaying {displayReceipts.length} Donation Receipts
              </span>
              <span className="text-xs text-slate-500">
                Total Collection: <strong className="text-slate-900">₹{displayReceipts.reduce((a,c) => a + (c.status !== 'Cancelled' ? Number(c.amount) : 0), 0).toLocaleString()}</strong>
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider">
                  <tr>
                    <th className="py-3 px-3">S NO</th>
                    <th className="py-3 px-3">DATE</th>
                    <th className="py-3 px-3">NAME OF DONOR</th>
                    <th className="py-3 px-3">ADDREES OF DONOR</th>
                    <th className="py-3 px-3">PAN OF DONOR</th>
                    <th className="py-3 px-3 text-right">AMT INVOLVED (₹)</th>
                    <th className="py-3 px-3">MODE OF PAYMENT</th>
                    <th className="py-3 px-3">NATURE (CORPUS / NON CORPUS)</th>
                    <th className="py-3 px-3">RECEIPT NO</th>
                    <th className="py-3 px-3 text-right">ACTIONS</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {displayReceipts.length === 0 ? (
                    <tr>
                      <td colSpan="10" className="py-12 text-center text-slate-400">
                        No receipts found for this selection. Click <strong>"Create Donation Receipt"</strong> or import Excel to view entries.
                      </td>
                    </tr>
                  ) : (
                    displayReceipts.map((r, idx) => {
                      const isCancelled = r.status === 'Cancelled';
                      const actCount = (r.activities || []).length;
                      const actUtilised = (r.activities || []).reduce((a,c) => a + Number(c.amountUtilised || 0), 0);

                      return (
                        <tr key={r.id} className={`hover:bg-slate-50/80 transition ${isCancelled ? 'bg-rose-50/30' : ''}`}>
                          <td className="py-3.5 px-3 font-bold text-slate-400">{r.sNo || (idx + 1)}</td>
                          <td className="py-3.5 px-3 text-slate-600 whitespace-nowrap">{r.date}</td>
                          <td className="py-3.5 px-3">
                            <div className="font-bold text-slate-900">{r.donorName}</div>
                          </td>
                          <td className="py-3.5 px-3 text-slate-600">{r.address || '—'}</td>
                          <td className="py-3.5 px-3 font-mono font-bold text-[#E22D4E]">{r.pan || '—'}</td>
                          <td className="py-3.5 px-3 font-extrabold text-slate-900 text-right whitespace-nowrap">₹{Number(r.amount).toLocaleString()}</td>
                          <td className="py-3.5 px-3 font-semibold text-slate-700">{r.paymentMode || 'UPI'}</td>
                          <td className="py-3.5 px-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              String(r.nature || r.purpose).toUpperCase().includes('CORPUS') && !String(r.nature || r.purpose).toUpperCase().includes('NON') 
                                ? 'bg-amber-100 text-amber-800' 
                                : 'bg-emerald-100 text-emerald-800'
                            }`}>
                              {r.nature || r.purpose || 'NON CORPUS'}
                            </span>
                          </td>
                          <td className="py-3.5 px-3 font-mono text-[11px] text-slate-500 whitespace-nowrap">
                            {r.receiptNo}
                            {isCancelled && <span className="ml-1 text-[9px] bg-rose-100 text-rose-700 font-bold px-1 py-0.5 rounded">Cancelled</span>}
                          </td>
                          
                          {/* Receipt Actions */}
                          <td className="py-3.5 px-3 text-right space-x-1.5 whitespace-nowrap">
                            <button 
                              onClick={() => onViewReceipt(r)}
                              className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold rounded-xl transition"
                              title="View & Download PDF"
                            >
                              PDF
                            </button>
                            <button 
                              onClick={() => onOpenActivities(r)}
                              className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-[#E22D4E] text-[11px] font-bold rounded-xl transition"
                              title="Manage activities and bills"
                            >
                              Activities ({actCount})
                            </button>
                            <button
                              onClick={() => {
                                const msg = `Dear ${r.donorName}, thank you for your generous contribution of Rs. ${r.amount} to Save The People Charitable Trust. Receipt No: ${r.receiptNo}.`;
                                window.open(`https://wa.me/${(r.mobile||'').replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
                              }}
                              className="px-2 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-[#00A859] font-bold text-[11px] transition"
                              title="Share on WhatsApp"
                            >
                              WhatsApp
                            </button>
                            {!isCancelled && (
                              <button
                                onClick={() => handleCancelReceipt(r.id)}
                                className="px-2 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-[11px] transition"
                                title="Cancel receipt"
                              >
                                Cancel
                              </button>
                            )}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

        </div>

    function ReceiptActivityModal({ receipt, onClose, onAddActivity }) {
      const [isAdding, setIsAdding] = useState(false);
      const [actDate, setActDate] = useState(new Date().toISOString().slice(0, 10));
      const [actName, setActName] = useState('');
      const [actCategory, setActCategory] = useState(ACTIVITY_CATEGORIES[0]);
      const [actDesc, setActDesc] = useState('');
      const [actAmount, setActAmount] = useState('');
      const [beneficiary, setBeneficiary] = useState('');
      const [uploadedFiles, setUploadedFiles] = useState([]);

      const activities = receipt.activities || [];
      const totalDonation = Number(receipt.amount || 0);
      const totalUtilised = activities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0);
      const remainingAmount = totalDonation - totalUtilised;

      const handleSave = (e) => {
        e.preventDefault();
        const amt = Number(actAmount);
        if (!amt || isNaN(amt)) {
          alert('Please enter a valid utilized amount.');
          return;
        }

        const newAct = {
          id: `ACT-${Date.now()}`,
          date: actDate,
          name: actName,
          category: actCategory,
          note: actDesc,
          amountUtilised: amt,
          beneficiary: beneficiary || 'Confidential Beneficiary',
          files: uploadedFiles.length > 0 ? uploadedFiles : ['support_bill_1.pdf']
        };

        onAddActivity(newAct);
        setIsAdding(false);
        setActName('');
        setActDesc('');
        setActAmount('');
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-3xl w-full shadow-2xl p-6 space-y-6">
            
            {/* Header */}
            <div className="flex justify-between items-start border-b border-slate-100 pb-4">
              <div>
                <span className="text-[10px] font-extrabold uppercase tracking-wider text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full">
                  Receipt-Linked Activities
                </span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">
                  Activities for Receipt: {receipt.receiptNo}
                </h3>
                <p className="text-xs text-slate-500">
                  Donor: <strong>{receipt.donorName}</strong> • Purpose: <strong>{receipt.purpose}</strong>
                </p>
              </div>

            {/* 4. Exact Statement Table (Matches HDFC Columns) */}
            <div className="border border-slate-300 rounded-xl overflow-x-auto">

                  {paginatedList.length === 0 ? (

                </tbody>
              </table>
            </div>

            {/* Pagination Controls */}
            {totalPages > 1 && (
              <div className="flex justify-between items-center text-xs font-semibold text-slate-600 pt-2">
                <span>Page {currentPage} of {totalPages} ({filteredTransactions.length} records)</span>
                <div className="flex items-center gap-1.5">
                  <button
                    disabled={currentPage === 1}

                  <button
                    disabled={currentPage === totalPages}
                    onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}

            {/* 5. STATEMENT SUMMARY BOX (EXACT TO HDFC FORMAT) */}
            <div className="border-2 border-slate-800 rounded-2xl p-4 bg-slate-50/60 font-mono text-xs space-y-2">

              <p>*Closing balance includes funds earmarked for hold and uncleared funds.</p>
              <p>Contents of this statement will be considered correct if no error is reported within 30 days of receipt of statement.</p>

    }

    // =========================================================================
    // SECTION 11 & 12: FINANCIAL REPORTS (CONSOLIDATED MONTHLY & YEARLY + EXCEL IMPORT)
    // =========================================================================
    function SectionFinancialReports({ receipts, setReceipts, bankAccounts, bankTransactions, selectedFY, setSelectedFY, selectedMonth, setSelectedMonth, orgSettings, notify, onOpenCreateReceipt }) {
      const fileInputRef = useRef(null);
      const [isImporting, setIsImporting] = useState(false);
      // 'all-years' = show every single record across all years.
      // 'fy-all' = show all records in selected FY without filtering by month.
      // 'month' = filter by selected month.
      const [viewFilter, setViewFilter] = useState('all-years'); // 'all-years' | 'fy-all' | 'month'

      // Search & Pagination States
      const [tableSearch, setTableSearch] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const [rowsPerPage, setRowsPerPage] = useState(50); // 25, 50, 100, 200, 500

      // Filter receipts according to viewFilter & tableSearch
      const filteredReceipts = useMemo(() => {
        let base = [];
        if (viewFilter === 'all-years') {
          base = receipts.filter(r => r.status !== 'Cancelled');
        } else if (viewFilter === 'fy-all') {
          base = receipts.filter(r => r.financialYear === selectedFY && r.status !== 'Cancelled');
        } else {
          base = receipts.filter(r => r.financialYear === selectedFY && r.month === selectedMonth && r.status !== 'Cancelled');
        }

        if (tableSearch.trim()) {
          const q = tableSearch.toLowerCase();
          base = base.filter(r => 
            (r.donorName && r.donorName.toLowerCase().includes(q)) ||
            (r.pan && r.pan.toLowerCase().includes(q)) ||
            (r.address && r.address.toLowerCase().includes(q)) ||
            (r.receiptNo && r.receiptNo.toLowerCase().includes(q)) ||
            (r.paymentMode && r.paymentMode.toLowerCase().includes(q)) ||
            (r.date && r.date.includes(q)) ||
            (r.sNo && String(r.sNo).includes(q))
          );
        }

        // Robust parser to convert any date representation to a valid timestamp
        const parseSortTime = (record) => {
          if (!record) return 9999999999999;
          const s = String(record.date || '').trim();
          
          // Check DD-MMYYYY or DD-MM-YYYY or DD.MM.YYYY
          // e.g., '24-112023' -> day 24, month 11, year 2023
          const compressedMatch = s.match(/^(\d{1,2})[-/.](\d{1,2})(\d{4})$/);
          if (compressedMatch) {
            const day = parseInt(compressedMatch[1], 10);
            const month = parseInt(compressedMatch[2], 10);
            const year = parseInt(compressedMatch[3], 10);
            return new Date(year, month - 1, day).getTime() || 0;
          }

          // Check standard DD-MM-YYYY
          const dmy = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
          if (dmy) {
            return new Date(parseInt(dmy[3], 10), parseInt(dmy[2], 10) - 1, parseInt(dmy[1], 10)).getTime() || 0;
          }

          // Check YYYY-MM-DD
          const ymd = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
          if (ymd) {
            let y = parseInt(ymd[1], 10);
            if (y < 2000) y = 2022; // Fix typo year like 0202
            return new Date(y, parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10)).getTime() || 0;
          }

          // Fallback parsing
          const t = new Date(s).getTime();
          if (!isNaN(t) && t > 0) return t;

          // If date string is unparseable, fall back to its Financial Year (e.g. 2023-24 -> 2023)
          if (record.financialYear) {
            const fyMatch = String(record.financialYear).match(/20(\d{2})/);
            if (fyMatch) {
              return new Date(parseInt(`20${fyMatch[1]}`, 10), 3, 1).getTime();
            }
          }
          return 9999999999999; // Put truly unparseable at the end, NEVER on top!
        };

        // Sort by Financial Year and S.No first, then chronologically by date
        return base.sort((a, b) => {
          const ta = parseSortTime(a);
          const tb = parseSortTime(b);
          if (ta !== tb) return ta - tb;
          return (Number(a.sNo) || 0) - (Number(b.sNo) || 0);
        });
      }, [receipts, selectedFY, selectedMonth, viewFilter, tableSearch]);

      // Reset to page 1 when filter or search changes
      useEffect(() => {
        setCurrentPage(1);
      }, [viewFilter, selectedFY, selectedMonth, tableSearch, rowsPerPage]);

      const totalPages = Math.max(1, Math.ceil(filteredReceipts.length / rowsPerPage));
      const paginatedReceipts = useMemo(() => {
        const start = (currentPage - 1) * rowsPerPage;
        return filteredReceipts.slice(start, start + rowsPerPage);
      }, [filteredReceipts, currentPage, rowsPerPage]);

      const totalDonationsAmount = filteredReceipts.reduce((a,c) => a + Number(c.amount || 0), 0);
      
      let matchedActivities = [];
      filteredReceipts.forEach(r => {
        (r.activities || []).forEach(a => matchedActivities.push({ ...a, receiptNo: r.receiptNo, donorName: r.donorName }));
      });
      const totalUtilisedAmount = matchedActivities.reduce((a,c) => a + Number(c.amountUtilised || 0), 0);

      // Handle Excel Upload (.xlsx / .xls)
      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsImporting(true);
        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            if (!window.XLSX) {
              alert("Excel reader library is loading. Please try again in 2 seconds.");
              setIsImporting(false);
              return;
            }

            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            
            let allRows = [];
            // Parse through all sheets
            workbook.SheetNames.forEach(sheetName => {
              const worksheet = workbook.Sheets[sheetName];
              // 1. First convert sheet to 2D array of rows to accurately detect header row
              const sheetData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
              if (!sheetData || !sheetData.length) return;

              // 2. Find which row index contains the column headers
              let headerRowIndex = 0;
              for (let i = 0; i < Math.min(sheetData.length, 10); i++) {
                const rowCells = sheetData[i].map(c => String(c).toLowerCase().replace(/[^a-z0-9]/g, ''));
                // Check if this row looks like header: has 'pan', 'donor', 'date', or 'amt'
                const hasPan = rowCells.some(c => c.includes('pan'));
                const hasDonor = rowCells.some(c => c.includes('donor') || c.includes('name'));
                const hasAmt = rowCells.some(c => c.includes('amt') || c.includes('amount'));
                if ((hasPan && hasDonor) || (hasDonor && hasAmt) || (hasPan && hasAmt)) {
                  headerRowIndex = i;
                  break;
                }
              }

              // 3. Extract JSON using the detected header row
              const json = window.XLSX.utils.sheet_to_json(worksheet, { range: headerRowIndex, defval: "" });
              if (json && json.length) {
                // Attach the sheet name to each row so we know its Financial Year (e.g. FY 2025-2026, FY 2024-2025, etc.)
                const withSheet = json.map(r => ({ ...r, _sheetName: sheetName }));
                allRows = [...allRows, ...withSheet];
              }
            });

            if (!allRows.length) {
              alert("No data found in the selected Excel file.");
              setIsImporting(false);
              return;
            }

            // Normalise and convert rows into official Trust Donation Receipts
            let importedCount = 0;
            const newReceipts = [];

            // Track running count per Financial Year during import
            const fyRunningCounts = {};
            // Count existing manual receipts per FY so new records continue sequentially if needed
            const existingManual = receipts.filter(r => !r.id.startsWith('REC-IMP-'));
            existingManual.forEach(r => {
              const f = r.financialYear || selectedFY;
              fyRunningCounts[f] = (fyRunningCounts[f] || 0) + 1;
            });

            allRows.forEach((row, idx) => {
              // Try finding PAN, Name, Amount, Date, Mobile from common column names
              const keys = Object.keys(row);
              const findVal = (keywords) => {
                const foundKey = keys.find(k => {
                  const cleanKey = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                  return keywords.some(kw => cleanKey.includes(kw));
                });
                return foundKey ? row[foundKey] : "";
              };

              const donorNameRaw = findVal(["nameofdonor", "donorname", "donor", "name", "client", "person"]);
              // If there's no donor name and no amount and no PAN, skip blank trailing rows
              if (!donorNameRaw && !row["AMT INVOLVED IN RS"] && !row["PAN OF DONOR"]) {
                return;
              }
              const donorName = donorNameRaw ? String(donorNameRaw).trim() : "Valued Donor";

              // Find PAN: check "panofdonor", "panno", "pan", etc.
              let panRaw = (findVal(["panofdonor", "donorpan", "pan", "pannumber", "panno"]) || "").toString().trim().toUpperCase();
              // Ignore placeholders like "NO", "NILL", "NIL", "NA", "NONE", "-"
              if (["NO", "NILL", "NIL", "NA", "N/A", "NONE", "-", ""].includes(panRaw)) {
                panRaw = "";
              }
              const pan = panRaw;

              // Exact columns from Excel
              const sNo = findVal(["sno", "slno", "serial"]) || (importedCount + 1);
              const address = (findVal(["addreesofdonor", "addressofdonor", "address", "city", "place"]) || "").toString().trim();
              const paymentMode = (findVal(["modeofpayment", "paymentmode", "mode", "method"]) || "UPI").toString().trim();
              const nature = (findVal(["naturedonationcorpusornoncorpus", "natureofdonation", "nature", "corpus", "noncorpus"]) || "NON CORPUS").toString().trim();

              // Amount
              let amount = parseFloat((findVal(["amtinvolvedinrs", "amountinvolved", "amount", "donationamount", "amt", "total"]) || "0").toString().replace(/[^0-9.]/g, ''));
              if (isNaN(amount) || amount <= 0) amount = 1000;

              const mobile = (findVal(["mobile", "phone", "contact", "cell"]) || "+91 98765 43210").toString();
              const dateRaw = findVal(["date", "receiptdate", "txndate", "donationdate"]);
              
              // Normalize Date (handles DD-MM-YYYY, YYYY-MM-DD, Excel serials, typos like 0202, etc.)
              let dateStr = "";
              if (dateRaw instanceof Date) {
                dateStr = dateRaw.toISOString().slice(0, 10);
              } else if (typeof dateRaw === 'number') {
                // Excel serial date format (offset 25569 days from Jan 1 1970)
                const excelDate = new Date(Math.round((dateRaw - 25569) * 86400 * 1000));
                if (!isNaN(excelDate.getTime())) dateStr = excelDate.toISOString().slice(0, 10);
              } else if (typeof dateRaw === 'string' && dateRaw.trim()) {
                const s = dateRaw.trim();
                // Check missing dash: e.g. 24-112023 -> day 24, month 11, year 2023
                const compressedDMY = s.match(/^(\d{1,2})[-/.](\d{1,2})(\d{4})/);
                // Check DD-MM-YYYY or DD/MM/YYYY or DD.MM.YYYY (e.g., 24-11-2023 or 24/11/2023)
                const dmyMatch = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
                // Check YYYY-MM-DD
                const ymdMatch = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);

                if (compressedDMY) {
                  const day = compressedDMY[1].padStart(2, '0');
                  const month = compressedDMY[2].padStart(2, '0');
                  const yr = compressedDMY[3];
                  dateStr = `${yr}-${month}-${day}`;
                } else if (dmyMatch) {
                  const p1 = parseInt(dmyMatch[1], 10);
                  const p2 = parseInt(dmyMatch[2], 10);
                  const yr = parseInt(dmyMatch[3], 10);
                  // Disambiguate if p1 > 12 -> p1 is day, p2 is month
                  let day = p1;
                  let month = p2;
                  if (month > 12 && day <= 12) {
                    // swapped month and day
                    day = p2;
                    month = p1;
                  }
                  dateStr = `${yr}-${String(Math.min(12, Math.max(1, month))).padStart(2, '0')}-${String(Math.min(31, Math.max(1, day))).padStart(2, '0')}`;
                } else if (ymdMatch) {
                  let yr = parseInt(ymdMatch[1], 10);
                  let m = parseInt(ymdMatch[2], 10);
                  let d = parseInt(ymdMatch[3], 10);
                  // Fix typos like 0202 -> 2022
                  if (yr === 202 || yr === 2020 || yr === 202) yr = 2022;
                  if (yr < 2000 && yr > 1900) { /* ok */ }
                  else if (yr < 2000) { yr = 2022; }
                  // Fix swapped month/day e.g. 2023-19-20 -> month 19 is invalid!
                  if (m > 12 && d <= 12) {
                    const temp = m;
                    m = d;
                    d = temp;
                  } else if (m > 12) {
                    m = 12;
                  }
                  dateStr = `${yr}-${String(Math.min(12, Math.max(1, m))).padStart(2, '0')}-${String(Math.min(31, Math.max(1, d))).padStart(2, '0')}`;
                } else {
                  dateStr = s.slice(0, 10);
                }
              }

              // Fallback if no valid date found in row
              if (!dateStr || dateStr.length < 8) {
                dateStr = "2025-04-01";
              }

              // Determine Financial Year and Month from date & sheet name
              let fy = selectedFY;
              let monthName = "April";

              try {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                  const y = parseInt(parts[0], 10);
                  const m = parseInt(parts[1], 10) - 1; // 0=Jan, 1=Feb, 2=Mar, 3=Apr... 11=Dec
                  if (!isNaN(y) && !isNaN(m) && m >= 0 && m <= 11) {
                    const CALENDAR_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                    monthName = CALENDAR_MONTHS[m];
                    const startYear = m >= 3 ? y : y - 1;
                    fy = `${startYear}-${(startYear + 1).toString().slice(-2)}`;
                  }
                }
              } catch(err) {}

              // If sheet name explicitly has FY (e.g. "FY 2021-2022" or "FY 2025-2026"), format it cleanly
              const sheetFYMatch = (row._sheetName || "").match(/20(\d{2})[-_\s/]*20?(\d{2})/i);
              if (sheetFYMatch) {
                const y1 = parseInt(`20${sheetFYMatch[1]}`, 10);
                const y2 = parseInt(`20${sheetFYMatch[2]}`, 10);
                const endShort = y2 ? String(y2).slice(-2) : String(y1 + 1).slice(-2);
                fy = `${y1}-${endShort}`;

                // If date was entered with a typo (like 0202 or 24-112023), align its year with the sheet's FY!
                if (dateStr.startsWith('0202-') || dateStr.includes('112023') || !dateStr.startsWith('20')) {
                  const m = monthName || "April";
                  dateStr = `${y1}-04-01`;
                }
              }

              // Auto-assign sequential receipt number strictly per Financial Year (starts at 000001)
              fyRunningCounts[fy] = (fyRunningCounts[fy] || 0) + 1;
              const seqNumber = String(fyRunningCounts[fy]).padStart(6, '0');
              const receiptNo = `${orgSettings.receiptPrefix || 'STPCT'}/${fy}/${seqNumber}`;

              newReceipts.push({
                id: `REC-IMP-${Date.now()}-${idx}`,
                sNo: sNo,
                receiptNo,
                date: dateStr,
                financialYear: fy,
                month: monthName,
                donorName: donorName,
                address: address,
                pan: pan,
                nature: nature,
                mobile: String(mobile).trim(),
                email: "",
                amount,
                amountInWords: numberToWordsINR(amount),
                purpose: nature || "NON CORPUS",
                paymentMode: paymentMode,
                refNo: `IT-PAN-IMP-${idx + 1}`,
                status: "Completed",
                activities: []
              });
              importedCount++;
            });

            if (newReceipts.length > 0) {
              // Replace any previous imported records with the fresh accurate ones
              const manualOnly = receipts.filter(r => !r.id.startsWith('REC-IMP-'));
              const combined = [...newReceipts, ...manualOnly];
              setReceipts(combined);
              
              // Set view to All Years so user immediately sees the entire dataset!
              setViewFilter('all-years');

              notify(`Successfully imported ${importedCount} records with PAN & Donor details across all Financial Years!`, "success");
            }
          } catch(err) {
            console.error("Excel import error:", err);
            alert("Error parsing Excel file: " + (err.message || err));
          } finally {
            setIsImporting(false);
            if (fileInputRef.current) fileInputRef.current.value = "";
          }
        };

        reader.readAsArrayBuffer(file);
      };

      const downloadExport = (mode = 'all') => {
        // mode: 'all' = export all years | 'fy' = export selected FY | 'month' = export selected month
        let targetReceipts = [];
        let title = "";

        if (mode === 'all') {
