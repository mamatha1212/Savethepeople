                      const reader = new FileReader();
                      reader.onload = ev => {
                        setForm({ ...form, signatureImage: ev.target.result });
                      };
                      reader.readAsDataURL(file);
                    }
                  }}
                  className="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#134479] file:text-white hover:file:bg-[#0e2a47] cursor-pointer"
                />

                {form.signatureImage ? (
                  <div className="h-10 px-3 bg-white border border-slate-200 rounded-xl flex items-center shadow-sm">
                    <img src={form.signatureImage} alt="Uploaded Signature" className="h-8 max-w-[120px] object-contain" />
                  </div>
                ) : (
                  <span className="text-[10px] text-slate-400 italic">No image uploaded (Default stylized cursive signature will be used)</span>
                )}
              </div>
            </div>
          </div>

          <button type="submit" className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-6 py-3 rounded-full shadow transition">
            Save Organization Settings
          </button>
        </form>
      );
    }

    // =========================================================================
    // SECTION 3 & 4: CREATE DONATION RECEIPT ENTRY MODAL
    // =========================================================================
    function CreateReceiptModal({ orgSettings, receipts, onClose, onSave }) {
      const today = new Date().toISOString().slice(0, 10);
      const [receiptDate, setReceiptDate] = useState(today);

      // Financial Year and Month Selection Options
      const availableYears = [
        "2026-27", "2025-26", "2024-25", "2023-24", "2022-23", "2021-22", "2020-21"
      ];
      const monthNames = [
        { name: "April", num: "04" },
        { name: "May", num: "05" },
        { name: "June", num: "06" },
        { name: "July", num: "07" },
        { name: "August", num: "08" },
        { name: "September", num: "09" },
        { name: "October", num: "10" },
        { name: "November", num: "11" },
        { name: "December", num: "12" },
        { name: "January", num: "01" },
        { name: "February", num: "02" },
        { name: "March", num: "03" }
      ];

      const [customReceiptNo, setCustomReceiptNo] = useState('');
      const [customSNo, setCustomSNo] = useState('');
      const [isManualOverride, setIsManualOverride] = useState(false);
      const [donorName, setDonorName] = useState('');
      const [mobile, setMobile] = useState('');
      const [email, setEmail] = useState('');
      const [pan, setPan] = useState('');
      const [address, setAddress] = useState('');
      const [amount, setAmount] = useState('');
      const [purpose, setPurpose] = useState('General Donation');
      const [otherPurpose, setOtherPurpose] = useState('');
      const [paymentMode, setPaymentMode] = useState('UPI');
      const [refNo, setRefNo] = useState('');

      // Auto compute Financial Year specifically from the selected date (e.g. Sept 2025 -> FY 2025-26)
      const computedFY = useMemo(() => {
        if (!receiptDate) return orgSettings.currentFY;
        const d = new Date(receiptDate);
        if (isNaN(d.getTime())) return orgSettings.currentFY;
        const y = d.getFullYear();
        const m = d.getMonth() + 1; // 1-12
        return m >= 4 ? `${y}-${String(y + 1).slice(-2)}` : `${y - 1}-${String(y).slice(-2)}`;
      }, [receiptDate, orgSettings]);

      // Quick Selector helper to set year and month easily
      const handleSelectFYAndMonth = (targetFY, targetMonthNum) => {
        const startYear = parseInt(targetFY.split('-')[0], 10);
        // If month is Jan/Feb/Mar (01, 02, 03), year is startYear + 1
        const actualYear = ['01', '02', '03'].includes(targetMonthNum) ? startYear + 1 : startYear;
        setReceiptDate(`${actualYear}-${targetMonthNum}-15`);
      };

      // Count only receipts belonging to THIS specific Financial Year so other FYs are NEVER disturbed
      const autoFYReceiptNumber = useMemo(() => {
        const fyReceipts = receipts.filter(r => r.financialYear === computedFY);
        const countInThisFY = fyReceipts.length + 1;
        const padded = String(countInThisFY).padStart(6, '0');
        return `${orgSettings.receiptPrefix || 'STPCT'}/${computedFY}/${padded}`;
      }, [receipts, orgSettings, computedFY]);

      const effectiveReceiptNo = isManualOverride && customReceiptNo.trim() ? customReceiptNo.trim() : autoFYReceiptNumber;

      const amountWords = useMemo(() => {
        return numberToWordsINR(Number(amount));
      }, [amount]);

      const handleSubmit = (createNext = false) => {
        if (!donorName || !amount) {
          alert('Please fill all mandatory fields (Donor Name, Amount).');
          return;
        }

        const dateObj = new Date(receiptDate);
        const monthName = FY_MONTHS[dateObj.getMonth() >= 3 ? dateObj.getMonth() - 3 : dateObj.getMonth() + 9];

        const fyReceipts = receipts.filter(r => r.financialYear === computedFY);
        const autoSNo = fyReceipts.length + 1;
        const finalSNo = customSNo ? parseInt(customSNo, 10) : autoSNo;

        const newRec = {
          id: `REC-${Date.now()}`,
          receiptNo: effectiveReceiptNo,
          sNo: finalSNo,
          date: receiptDate,
          financialYear: computedFY,
          month: monthName,
          donorName,
          mobile: mobile || '',
          email: email || '',
          pan: pan ? pan.toUpperCase() : '',
          address: address || '',
          amount: Number(amount),
          amountInWords: amountWords,
          purpose: purpose === 'Other' ? otherPurpose : purpose,
          paymentMode,
          refNo: refNo || `${paymentMode}-DIRECT`,
          status: 'Completed',
          activities: []
        };

        onSave(newRec, createNext);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5">
            
            {/* Header */}
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100">
                    Receipt No: {effectiveReceiptNo}
                  </span>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200">
                    FY {computedFY}
                  </span>
                </div>
                <h3 className="text-lg font-extrabold text-slate-900 mt-1">Donation Receipt Entry</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); handleSubmit(false); }} className="space-y-4 text-xs font-semibold">
              
              {/* Part A: Date & Sequence Management */}
              <div className="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-200/80 space-y-3">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Receipt Date *</label>
                    <input 
                      required 
                      type="date" 
                      value={receiptDate} 
                      onChange={e => setReceiptDate(e.target.value)} 
                      className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold focus:ring-2 focus:ring-[#E22D4E] focus:outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Financial Year (Auto-detected)</label>
                    <input disabled type="text" value={`FY ${computedFY}`} className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 cursor-not-allowed" />
                  </div>
                </div>

                {/* Quick Previous Year & Month Jump Selector */}
                <div className="p-2.5 bg-amber-50/70 rounded-xl border border-amber-200/60 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-bold uppercase text-amber-800 flex items-center gap-1.5">
                      <span>📅</span> Quick Pick: Previous Year & Month
                    </span>
                    <span className="text-[10px] text-amber-700 font-semibold">Instantly sets date & audit sequence</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[9px] font-bold uppercase text-amber-700 mb-0.5">Select Financial Year</label>
                      <select 
                        value={computedFY}
                        onChange={e => {
                          const targetFY = e.target.value;
                          const currentMonth = receiptDate ? receiptDate.slice(5, 7) : '04';
                          handleSelectFYAndMonth(targetFY, currentMonth);
                        }}
                        className="w-full bg-white border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800"
                      >
                        {availableYears.map(yr => (
                          <option key={yr} value={yr}>FY {yr} {yr === orgSettings.currentFY ? '(Current)' : '(Previous Year)'}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[9px] font-bold uppercase text-amber-700 mb-0.5">Select Month</label>
                      <select 
                        value={receiptDate ? receiptDate.slice(5, 7) : '04'}
                        onChange={e => {
                          const targetMonth = e.target.value;
                          handleSelectFYAndMonth(computedFY, targetMonth);
                        }}
                        className="w-full bg-white border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800"
                      >
                        {monthNames.map(m => (
                          <option key={m.num} value={m.num}>{m.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                {/* Audit Sequence Controls */}
                <div className="pt-2 border-t border-slate-200/60">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] text-slate-600 font-bold">
                      💡 Auto Sequence: <strong className="text-rose-600">{autoFYReceiptNumber}</strong> (Specific to FY {computedFY})
                    </span>
                    <button
                      type="button"
                      onClick={() => setIsManualOverride(!isManualOverride)}
                      className="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 underline"
                    >
                      {isManualOverride ? "← Use Auto Sequence" : "✏️ Custom ID / Middle Bill Override"}
                    </button>
                  </div>

                  {isManualOverride && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2.5 p-3 bg-white rounded-xl border border-indigo-100 shadow-sm">
                      <div>
                        <label className="block text-[10px] font-bold uppercase text-indigo-700 mb-1">
                          Custom Receipt ID (e.g. STPCT/{computedFY}/000045A)
                        </label>
                        <input
                          type="text"
                          value={customReceiptNo}
                          onChange={e => setCustomReceiptNo(e.target.value)}
                          placeholder={autoFYReceiptNumber}
                          className="w-full bg-indigo-50/40 border border-indigo-200 rounded-lg px-3 py-1.5 text-xs font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold uppercase text-indigo-700 mb-1">
                          Custom S NO (Optional)
                        </label>
                        <input
                          type="number"
                          value={customSNo}
                          onChange={e => setCustomSNo(e.target.value)}
                          placeholder="Leave blank for auto"
                          className="w-full bg-indigo-50/40 border border-indigo-200 rounded-lg px-3 py-1.5 text-xs font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Part B: Donor Info */}
              <div className="space-y-3 pt-2 border-t border-slate-100">
                <span className="text-[10px] font-extrabold uppercase text-slate-400">Donor Particulars</span>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Received With Thanks From (Donor Name) *</label>
                    <input required type="text" placeholder="e.g. Ramesh Kumar" value={donorName} onChange={e => setDonorName(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mobile Number *</label>
                    <input required type="tel" placeholder="+91 98765 43210" value={mobile} onChange={e => setMobile(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donor PAN Number (Optional - for 80G)</label>
                    <input type="text" placeholder="ABCDE1234F" maxLength={10} value={pan} onChange={e => setPan(e.target.value.toUpperCase())} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs uppercase" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Email ID (For Auto PDF Delivery)</label>
                    <input type="email" placeholder="ramesh@example.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Address (Optional)</label>
                  <input type="text" placeholder="Residential / Org Address" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>

              {/* Part C & D: Donation Amount & Payment */}
              <div className="space-y-3 pt-2 border-t border-slate-100">
                <span className="text-[10px] font-extrabold uppercase text-slate-400">Donation & Payment Details</span>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donation Amount (₹) *</label>
                    <input required type="number" placeholder="e.g. 5000" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-extrabold text-[#E22D4E]" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Donation Purpose *</label>
                    <select value={purpose} onChange={e => setPurpose(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
                      {DONATION_PURPOSES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                </div>

                {/* Amount in words preview */}
                <div className="p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[11px] text-slate-600 italic">
                  <strong>Amount in Words:</strong> {amountWords}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Payment Mode *</label>
                    <select value={paymentMode} onChange={e => setPaymentMode(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold">
                      <option value="UPI">UPI (GPay / PhonePe / QR)</option>
                      <option value="Bank Transfer">Bank Transfer (NEFT / RTGS / IMPS)</option>
                      <option value="Cash">Cash</option>
                      <option value="Cheque">Cheque / Demand Draft</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Transaction Ref / Cheque No</label>
                    <input type="text" placeholder="e.g. UTR / UPI Ref ID" value={refNo} onChange={e => setRefNo(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col sm:flex-row justify-end gap-2 pt-4 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100">
                  Cancel
                </button>
                <button 
                  type="button" 
                  onClick={() => handleSubmit(true)}
                  className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow transition"
                >
                  Save & Create Next
                </button>
                <button 
                  type="submit" 
                  className="bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs px-6 py-2.5 rounded-xl shadow-lg transition"
                >
                  Save & Generate PDF
                </button>
              </div>

            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 6: INDIVIDUAL DONATION RECEIPT VIEW & PDF PRINTABLE MODAL
    // (ACCURATE BLUE-BORDER BOOK FORMAT MATCHING OFFICIAL SAVE THE PEOPLE CHARITABLE TRUST RECEIPT)
    // =========================================================================
    function ReceiptViewModal({ receipt, orgSettings, setOrgSettings, onClose, notify }) {
      const [isDownloading, setIsDownloading] = useState(false);
      const fileInputRef = useRef(null);

      // Download Receipt as PDF file directly
      const handleDownloadPDF = () => {
        const element = document.getElementById('printable-receipt');
        if (!element) {
          window.print();
          return;
        }

        const cleanDonor = (receipt.donorName || 'Donor').replace(/[^a-zA-Z0-9]/g, '_');
        const cleanNo = (receipt.receiptNo || 'Receipt').replace(/[^a-zA-Z0-9]/g, '_');
        const filename = `${cleanNo}_${cleanDonor}.pdf`;

        if (window.html2pdf) {
          setIsDownloading(true);
          const opt = {
            margin:       [10, 10, 10, 10],
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          window.html2pdf().set(opt).from(element).save().then(() => {
            setIsDownloading(false);
            if (notify) notify(`Downloaded ${filename} successfully!`);
          }).catch(err => {
            console.error("PDF download error:", err);
            setIsDownloading(false);
            window.print(); // Fallback to print
          });
        } else {
          window.print();
        }
      };

      // Format Date like 31 / 03 / 2023 or 31/03/2023
      const formattedDate = useMemo(() => {
        if (!receipt.date) return '';
        const parts = String(receipt.date).split('-');
        if (parts.length === 3) {
          return `${parts[2]} / ${parts[1]} / ${parts[0]}`;
        }
        return receipt.date;
      }, [receipt.date]);

      // Extract serial number (clean integer like 352 without leading zero clutter)
      const displaySNo = useMemo(() => {
        if (receipt.sNo) return receipt.sNo;
        if (receipt.receiptNo) {
          const raw = receipt.receiptNo.split('/').pop();
          const clean = parseInt(raw, 10);
          return isNaN(clean) ? raw : clean;
        }
        return '1';
      }, [receipt]);

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5">
          <div className="bg-white rounded-3xl max-w-3xl w-full shadow-2xl overflow-hidden space-y-3">
            
            {/* Top Toolbar - Clean Single Row */}
            <div className="bg-[#0f172a] px-5 py-3 text-white flex items-center justify-between gap-4 border-b border-slate-800">
              
              {/* Left Group: Title Badge */}
              <div className="flex items-center gap-2">
                <span className="bg-[#134479] text-white text-[11px] font-bold px-3 py-1 rounded-md shadow-sm border border-[#2b5685] uppercase tracking-wider flex items-center gap-1.5">
                  <span>📘</span> Official Trust Receipt
                </span>
              </div>

              {/* Middle Group: Custom Signature Upload */}
              <div className="flex items-center gap-2">
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  accept="image/*" 
                  onChange={e => {
                    const file = e.target.files[0];
                    if (file) {
                      const reader = new FileReader();
                      reader.onload = ev => {
                        const updated = { ...orgSettings, signatureImage: ev.target.result };
                        if (setOrgSettings) setOrgSettings(updated);
                        try { localStorage.setItem('stp_org_settings', JSON.stringify(updated)); } catch(err) {}
                        if (notify) notify("Signature image updated!");
                      };
                      reader.readAsDataURL(file);
                    }
                  }}
                  className="hidden" 
                />
                <button 
                  type="button" 
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition"
                >
                  <span>📷</span> {orgSettings.signatureImage ? "Change Sign Image" : "Upload Custom Signature"}
                </button>

                {orgSettings.signatureImage && (
                  <button 
                    type="button" 
                    onClick={() => {
                      const updated = { ...orgSettings, signatureImage: '' };
                      if (setOrgSettings) setOrgSettings(updated);
                      try { localStorage.setItem('stp_org_settings', JSON.stringify(updated)); } catch(err) {}
                      if (notify) notify("Reverted to default J. Sudheer signature");
                    }}
                    className="text-xs text-slate-400 hover:text-rose-400 underline px-1 font-semibold"
                  >
                    Reset
                  </button>
                )}
              </div>

              {/* Right Group: Action Buttons */}
              <div className="flex items-center gap-2">
                <button 
                  onClick={handleDownloadPDF}
                  disabled={isDownloading}
                  className="bg-[#00A859] hover:bg-[#008f4c] text-white text-xs font-bold px-3.5 py-1.5 rounded-lg shadow transition flex items-center gap-1.5 disabled:opacity-60"
                >
                  <span>💾</span> {isDownloading ? "Saving..." : "Download PDF"}
                </button>
                <button 
                  onClick={onClose} 
                  className="text-slate-400 hover:text-white text-base px-1.5 py-0.5 rounded-lg hover:bg-slate-800 transition font-bold"
                >
                  ✕
                </button>
              </div>

            </div>

            {/* PRINTABLE RECEIPT TEMPLATE (OFFICIAL TRUST BOOK FORMAT) */}
            <div className="p-4 sm:p-6 bg-slate-100 flex justify-center">
              <div 
                id="printable-receipt" 
                className="bg-white w-full max-w-2xl p-5 sm:p-6 border-[3px] border-[#134479] rounded-md shadow-lg text-[#0f2e52] relative select-text"
                style={{ minHeight: '430px' }}
              >
                {/* Outer Inner Border Accent */}
                <div className="border border-[#134479] p-4 sm:p-5 rounded-sm relative">

                  {/* Top Row: S.No, Banner Pill, Date */}
                  <div className="flex justify-between items-center pb-2 border-b border-[#2b5685]/30">
                    <div className="flex items-baseline gap-1">
                      <span className="text-xs sm:text-sm font-bold text-[#0f2e52]">S.No. :</span>
                      <span className="text-sm sm:text-base font-extrabold text-[#7e22ce] tracking-widest border-b border-dotted border-[#7e22ce] px-2 font-mono">
                        {displaySNo}
                      </span>
                    </div>

                    <div className="bg-[#1f4e8c] text-white font-extrabold text-[11px] sm:text-xs tracking-wider uppercase px-4 py-1 rounded-sm shadow-sm">
                      DONATION RECEIPT
                    </div>

                    <div className="flex items-baseline gap-1">
                      <span className="text-xs sm:text-sm font-bold text-[#0f2e52]">Date :</span>
                      <span className="text-xs sm:text-sm font-bold text-[#0f2e52] border-b border-[#0f2e52] px-2">
                        {formattedDate}
                      </span>
                    </div>
                  </div>

                  <p className="text-xs uppercase font-bold tracking-widest text-slate-400">Verified & 80G Certified</p>
                </div>
              </div>
            </div>
          </section>

          {/* 6. CALL TO ACTION VOLUNTEER BANNER */}
          <section className="py-20 bg-gradient-to-r from-[#E22D4E] to-[#F15A24] text-white">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-6">
              <span className="bg-white/20 text-white text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">
                Be The Change
              </span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-serif-heading max-w-2xl mx-auto">
                Ready to make a real difference in someone's life?
              </h2>
              <p className="text-rose-100 max-w-xl mx-auto text-base">
                Whether you wish to sponsor a child's education, contribute emergency meals, or volunteer your skills on the field, your support matters.
              </p>
              <div className="flex flex-wrap justify-center gap-4 pt-2">
                <button 
                  onClick={() => handleOpenDonate()}
                  className="bg-white text-[#E22D4E] hover:bg-slate-100 font-extrabold text-sm px-8 py-4 rounded-full shadow-xl transition"
                >
                  Donate Online Now
                </button>
                <button 
                  onClick={() => setIsVolunteerOpen(true)}
                  className="bg-[#10141E] hover:bg-black text-white font-bold text-sm px-8 py-4 rounded-full shadow-xl transition"
                >
                  Join as Volunteer
                </button>
              </div>
            </div>
          </section>

          {/* 7. COMPLETE FOOTER */}
          <footer className="bg-[#10141E] text-slate-400 pt-16 pb-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div className="space-y-4">
                  <div className="flex items-center">
                    <img 
                      src="images/save_the_people_logo.jpeg" 
                      alt="Save The People" 
                      className="h-16 w-auto object-contain rounded"
                      onError={e => e.target.style.display = 'none'}
                    />
                  </div>
                  <p className="text-xs leading-relaxed text-slate-400">
                    A registered non-profit organization helping children, low-income families, and patients across India with dignity and care.
                  </p>
                  <div className="text-xs font-semibold text-slate-300">
                    <span className="text-[#00A859]">✓ 80G Certified Non-Profit</span>
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Quick Links</h4>
                  <ul className="space-y-2 text-xs">
                    <li><a href="#" className="hover:text-white transition">Home</a></li>
                    <li><a href="#about" className="hover:text-white transition">About Our Mission</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Urgent Causes</a></li>
                    <li><a href="#impact" className="hover:text-white transition">Financial Impact</a></li>
                    <li><button onClick={onOpenAdmin} className="text-rose-400 hover:text-rose-300 transition">Admin Login</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Key Causes</h4>
                  <ul className="space-y-2 text-xs">
                    <li><a href="#causes" className="hover:text-white transition">Hunger & Malnutrition</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Childhood Education</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Emergency Medical Care</a></li>
                    <li><a href="#causes" className="hover:text-white transition">Disaster Relief Fund</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-4">Support & Donate</h4>
                  <p className="text-xs text-slate-400 mb-4">
                    All donations are exempt from tax under Section 80G. Instant payment confirmation via Razorpay.
                  </p>
                  <button 
                    onClick={() => handleOpenDonate()}
                    className="w-full bg-[#E22D4E] hover:bg-[#c92040] text-white font-extrabold text-xs py-3 rounded-full transition"
                  >
                    Make a Direct Donation
                  </button>
                </div>
              </div>

              <div className="border-t border-slate-800 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                <p>© {new Date().getFullYear()} Save The People. All Rights Reserved.</p>
                <div className="flex gap-4">
                  <span>Razorpay Secured</span>
                  <span>•</span>
                  <span>80G Registered NGO</span>
                </div>
              </div>
            </div>
          </footer>

          {/* Direct Donation Popup */}
          {isDonateOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">Donate to Save The People</h3>
                  <button onClick={() => setIsDonateOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-600">
                  Cause: <strong>{selectedCause ? selectedCause.title : "General Trust Support"}</strong>
                </p>
                <div className="p-4 bg-rose-50 rounded-2xl border border-rose-100 text-center space-y-2">
                  <p className="text-xs font-bold text-slate-700">Scan & Pay via any UPI App or NetBanking</p>
                  <p className="text-xs font-mono font-bold text-[#E22D4E]">UPI ID: savethepeople@sbi</p>
                  <p className="text-[11px] text-slate-500">Official 80G Tax Exemption receipts are generated immediately upon receipt verification.</p>
                </div>
                <button 
                  onClick={() => {
                    alert("Thank you! For online auto-receipts, open Admin Panel → 2. Donation Receipts.");
                    setIsDonateOpen(false);
                  }}
                  className="w-full bg-[#E22D4E] text-white font-bold py-3 rounded-full text-xs"
                >
                  Confirm & Request Receipt
                </button>
              </div>
            </div>
          )}

          {/* Volunteer Modal */}
          {isVolunteerOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">Become a Volunteer</h3>
                  <button onClick={() => setIsVolunteerOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); alert("Volunteer application submitted!"); setIsVolunteerOpen(false); }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                    <input required type="text" placeholder="Your name" className="w-full bg-slate-50 border rounded-xl px-3.5 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Phone Number</label>
                    <input required type="tel" placeholder="+91 98765 43210" className="w-full bg-slate-50 border rounded-xl px-3.5 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Field of Interest</label>
                    <select className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
                      <option>Food & Ration Distribution</option>
                      <option>Medical Health Camps</option>
                      <option>Child Teaching & Mentorship</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-[#E22D4E] text-white font-bold py-3 rounded-full text-xs">
                    Submit Application
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Global Error Logger and Resilient Error Boundary
    window.addEventListener('error', function(e) {
      console.error('Window error captured:', e.error || e.message);
    });

    class ErrorBoundary extends React.Component {
      constructor(props) { 
        super(props); 
        this.state = { hasError: false, error: null }; 
      }
      static getDerivedStateFromError(error) { 
        return { hasError: true, error }; 
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Component Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-lg mx-auto my-12 bg-white rounded-3xl border border-rose-200 shadow-xl text-center space-y-4">
              <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
              <h2 className="text-base font-extrabold text-slate-900">Application Notice</h2>
              <p className="text-xs text-slate-500 font-mono bg-slate-50 p-3 rounded-xl border border-slate-100 break-words text-left">
                {this.state.error?.message || "An unexpected rendering event occurred."}
              </p>
              <button 
                onClick={() => { localStorage.clear(); window.location.reload(); }} 
                className="bg-[#E22D4E] hover:bg-[#c92040] text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow transition"
              >
                Clear Local Cache & Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
